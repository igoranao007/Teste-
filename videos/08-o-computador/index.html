<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- PLANO 8 · O COMPUTADOR (14,5 s): (0–1,7) Igor gira a cadeira e leva a fita até o videocassete · (1,7–4,5) close: a fita entra, o LED acende, o monitor liga
     · (4,5–8,5) por cima do ombro, mãos nas teclas · (8,5–10) Igor iluminado de verde (fala 3) · (10–11,5) Phantom atrás, quase invisível · (11,5–14,5) código rolando, ACESSANDO...
     As coordenadas são "de frente pro computador" (x pra direita dele… z pro monitor) e passam por rot() pra virar mundo. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:14.5}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from "../../lib/ps1.js";
import * as A from "../../lib/arh.js";
import * as F from "../../lib/filme.js";
import * as T from "../../lib/tgp.js";
import * as K from "../../lib/terminal.js";
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({ fov: 40, cam: [0, 1, 1.75], alvo: [0, 1.02, 0], fundo: '#020604', nevoa: { cor: F.SOMBRA, perto: 3, longe: 11 }, luz: F.LUZ_SALA }), cena = S.scene;
  const { I, c, Y, lamp, pc, vcr, est, rot, ANG } = await F.salaIgor(cena);
  const hol = new THREE.Group(); hol.rotation.y = ANG; cena.add(hol); const fita = await T.fitaVHS(); hol.add(fita); fita.rotation.x = -Math.PI / 2;
  const Ph = await T.phantom(); cena.add(Ph.obj); Ph.obj.position.set(...rot(.55, 0, -.85)); Ph.obj.rotation.y = ANG; const fc = Ph.corpo; fc.braco('L', [.1, -1, .02], [.04, -1, .08]); fc.braco('R', [-.1, -1, .02], [-.04, -1, .06]); fc.guardar();
  const VOZ = await fetch('../../material/voz-igor.json').then(r => r.ok ? r.json() : null).catch(() => null);
  const boca = TT => { let v = 0; for (const f of VOZ?.p8 ?? []) { const q = Math.round((TT - f.t) * 30); if (q >= 0 && q < f.env.length) v = Math.max(v, f.env[q]); } return v; };
  const term = K.terminal(), D = 4.5, B = [-.07, Y + .055, .49];                       // boca do videocassete (coordenada de frente pro computador)
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...rot(...p)); S.camera.lookAt(...rot(...a)); S.camera.updateProjectionMatrix(); };
  S.update = TT => {
    const t = TT - D, ligada = TT >= 3.7 ? 1 : 0;
    F.telaCodigo(pc, TT, ligada); vcr.led(TT >= 3.2); I.girar(P.suave(-.4, .9, TT));
    const tremor = ligada * (.75 + .25 * Math.sin(TT * 23) * Math.sin(TT * 7));
    lamp.acender(1, S.camera);
    const m = {};
    if (TT < D) {                                                                       // a fita vai da mão pra boca do videocassete (pelo lado direito dele, sem cruzar o corpo)
      const leva = P.suave(.2, 1.5, TT), entra = P.suave(1.7, 2.7, TT), sai = P.suave(2.8, 3.5, TT);
      const fz = P.lerp(B[2] - .2, B[2] - .075, leva) + entra * .16, fy = P.lerp(Y + .26, B[1], leva), fx = P.lerp(-.24, B[0], leva);
      fita.visible = true; hol.position.set(...rot(fx, fy, fz));
      m.R = rot(fx - .02, fy + .035 + sai * .1, fz - .1 - sai * .12); m.poloR = rot(-.9, -.3, -.2); m.extra = .06;
    } else { fita.visible = false; const tk = s => Math.max(0, Math.sin(t * 19 + s)) * .016;
      m.R = rot(-.1 + Math.sin(t * 5.1) * .035, Y + .075 + tk(0), .2); m.L = rot(.1 + Math.sin(t * 4.3 + 1) * .035, Y + .075 + tk(2), .2); m.poloR = rot(-.9, -.3, -.2); m.poloL = rot(.9, -.3, -.2); m.plana = true; m.extra = .04; }
    const fala = boca(TT); I.pose(TT, m); I.animar(TT, { boca: fala, pisca: (TT % 4.1) > 3.95 ? 1 : 0 }); I.cabeca.rotation.x += .12 * (TT < 8.2 ? 1 : .3);
    Ph.animar(TT, { pisca: (TT % 3) < .12 ? 1 : 0, pont: t >= 5.5 && t < 7 ? .26 + .04 * Math.sin(t * 2.1) : .2 });
    const tela = { ...F.LUZ_SALA, keyDir: rot(0, .1, 1), keyCor: '#' + new THREE.Color('#39ff6a').multiplyScalar(tremor).getHexString(), fillDir: rot(-.6, .6, -.4), fillCor: '#16321f', amb: '#12241a' };
    if (TT < 1.7) cam([-1.3, 1.3, .5], [-.04, Y + .24, .3], 44);
    else if (TT < D) cam([.4, Y + .2 - (TT - 1.7) * .01, .1], [B[0] + .02, B[1] + .03, B[2]], 34);
    else if (t < 4) { P.luz({ ...tela, keyDir: rot(0, .2, 1), amb: '#1a2c20' }); cam([-.72 + t * .015, 1.6, -1.05], [.05, Y + .22, .42], 46); }
    else if (t < 5.5) { P.luz(tela); cam([.14, 1.28, 1.2 - (t - 4) * .04], [0, 1.3, 0], 32); }
    else { P.luz(tela); cam([-.55, 1.66, .9], [.5, 1.5, -.85], 34); }
    est.visible = t < 4; lamp.visible = t < 4;
    const cod = t >= 7; term.el.style.opacity = cod ? 1 : 0;
    if (cod) { const u = t - 7; term.limpar(); term.codigo(u, { vel: 70 }); term.caixa(110, 108, 260, 54, '#010a04'); term.moldura(110, 108, 260, 54);
      term.txt('ACESSANDO' + '.'.repeat(1 + Math.floor(u * 3) % 3), 240, 122, 22, K.CLARO, { alinhar: 'center', peso: 800 }); term.pixelar(); term.sinal(Math.round(TT * 30), .04); }
  };
};
</script></body></html>
