<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EPISÓDIO 1 (reformulado) · CENA 63 · A ENTREGA EM POV DO ADRYAN (versão nova do plano 52, que fica intacto). A câmera é o olhar do
     Adryan: ele entra com o Gusta ao lado, a maleta na mão; o Igor vira a cadeira: "Trouxeram?"; o Adryan estende a maleta por cima da
     mesa e o IGOR PEGA da mão dele e pousa na mesa; as pastas PIOLHO, RORAIMA, JV, PHANTOM ("Todos eles têm potencial..."); o Igor
     volta pra maleta: "Então... o ARG-14." (o Nicolas nunca esteve na sala). ?cam=x,y,z,ax,ay,az,fov (inspeção) -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:14}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({ fov: 40, cam: [0, 1, 1.75], alvo: [0, 1.02, 0], fundo: '#020604', nevoa: { cor: F.SOMBRA, perto: 3, longe: 12 }, luz: F.LUZ_SALA }), cena = S.scene;
  const sala = await V.salaIgor4(cena), { I, Y, lamp, est } = sala, fala = await V.vozes('ep1'); S.camera.near = .03; S.camera.updateProjectionMatrix();
  const q = new URLSearchParams(location.search), camQ = q.get('cam')?.split(',').map(Number);
  const Ad = await E4.ator('adryan'), Gu = await E4.ator('gusta'); cena.add(Ad.obj, Gu.obj); T.poses(Ad.modelo);
  const mal = T.maleta(); cena.add(mal);
  const MESA = new THREE.Vector3(-.3, Y, .46), v3 = (x, y, z) => new THREE.Vector3(x, y, z);
  // as 4 fichas, deitadas na mesa uma por cima da outra
  const NOMES = ['piolho', 'roraima', 'jv', 'phantom'], fichas = [];
  for (const [i, n] of NOMES.entries()) { const tx = await V.pastaFicha(n); const f = P.malha(new THREE.PlaneGeometry(.4, .3), P.mat({ mapa: tx }), { pos: [.32, Y + .004 + i * .002, .62], rot: [-Math.PI / 2, 0, -.08 + i * .05] }); cena.add(f); fichas.push(f); }
  const capa = P.caixa(.42, .012, .32, P.mat({ cor: '#7a6a44' }), { pos: [.32, Y + .02, .62] }); cena.add(capa);
  const porta = P.malha(new THREE.PlaneGeometry(1.1, 3.4, 2, 6), P.mat({ cor: '#7dffa0', opac: .16, aditivo: true, semLuz: true, lados: THREE.DoubleSide }), { pos: [-.7, .02, 3.6], rot: [-Math.PI / 2, 0, 0] }); cena.add(porta);
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...p); S.camera.lookAt(...a); S.camera.updateProjectionMatrix(); };
  const AD_FIM = [-.12, 1.32], GU_FIM = [-.95, 1.62], MAL_MESA = new THREE.Vector3(-.05, Y, .52);
  const ALCA = () => mal.localToWorld(v3(0, mal.alca, 0));                                   // alça (no alto da maleta em pé)
  S.update = t => {
    sala.video(t + 14); V.luzSalaVerde(sala, t, S.camera); porta.scale.x = P.suave(0, .6, t);
    I.girar(1 - P.suave(1.0, 2.0, t));
    // Adryan (POV, com a maleta) e Gusta entram (0,3–3,6) até a frente da mesa e viram pro Igor
    for (const [A2, a, b] of [[Ad, [-.75, 3.6], AD_FIM], [Gu, [-1.55, 3.9], GU_FIM]]) if (!V.caminhar(A2, a, b, t, .3, 3.6)) { A2.obj.rotation.y = V.angLerp(Math.atan2(b[0] - a[0], b[1] - a[1]), Math.PI + (A2 === Gu ? .35 : 0), P.suave(3.6, 4.0, t)); A2.pose('idle', t); }
    Ad.obj.updateMatrixWorld(true);
    // a ENTREGA: o Adryan ergue a maleta por cima da mesa (3,8–4,7) · o Igor pega pela alça (4,6–5,1) · leva pra mesa e deita (5,1–5,9)
    const ergue = P.suave(3.8, 4.7, t) * (1 - P.suave(5.0, 5.5, t)), pega = P.suave(4.6, 5.1, t), pousa = P.suave(5.1, 5.9, t);
    const ALTO = v3(.1, Y + .2, .98);                                                       // maleta erguida, oferecida por cima da borda da mesa
    if (pega < 1) { if (ergue > 0) Ad.modelo.alcancar('R', Ad.osso('hand.R').getWorldPosition(v3()).lerp(ALTO.clone().add(v3(0, mal.alca + .02, 0)), ergue).toArray(), [.9, -.6, .1], .05);
      Ad.obj.updateMatrixWorld(true); mal.deitar(0); V.segurarMaleta(Ad, mal, t); }
    else { mal.position.lerpVectors(ALTO, MAL_MESA, pousa); mal.position.y += Math.sin(pousa * Math.PI) * .08; mal.rotation.set(0, Math.PI / 2, 0); mal.deitar(P.suave(.2, .9, pousa)); }
    mal.pulsar(t);
    // Igor: "Trouxeram?" · estende a mão e pega a maleta · abre as pastas (6,0–11,0) · fecha e olha a maleta
    const ab = P.clamp((t - 6.0) / 5.0), qual = Math.min(3, Math.floor(ab * 4)), aberto = t > 6.0 && t < 11.0;
    capa.visible = !aberto; fichas.forEach((f, i) => { f.visible = aberto ? i <= qual : false; });
    const m = { inclina: .02 * Math.sin(t * 1.1) + .12 * pega * (1 - pousa) };
    const kR = P.suave(4.3, 4.95, t) * (1 - P.suave(5.9, 6.5, t));
    if (kR > 0) { m.R = ALCA().toArray(); m.kR = kR; m.poloR = [-.6, -.6, -.2]; }
    if (aberto) { m.L = [.32 + .1 * Math.sin(t * 3), Y + .07, .5]; m.kL = P.suave(5.6, 6.35, t) * (1 - P.suave(10.7, 11.3, t)); m.plana = true; m.pegada = { L: { dedos: [0, -.5, 1], indice: [-1, 0, 0] } }; }
    const v = fala('63', t, 'igor'); I.pose(t, m); I.animar(t, { boca: v, pisca: (t % 4.1) > 3.95 ? 1 : 0 });
    const praEles = P.suave(1.2, 2.0, t) * (1 - P.suave(5.3, 5.9, t)), praMesa = P.suave(5.6, 6.2, t) * (1 - P.suave(11.0, 11.4, t)), praAd = P.suave(11.0, 11.4, t);
    I.cabeca.rotation.y += .1 * praEles; I.cabeca.rotation.x += -.12 * praEles + .5 * praMesa - .1 * praAd;
    est.visible = true;
    // POV: a câmera é o olhar do Adryan (logo à frente do rosto), mirando o que ele olha
    const olho = Ad.osso('spine.005').getWorldPosition(v3()).add(v3(0, .08, 0)).addScaledVector(v3(Math.sin(Ad.obj.rotation.y), 0, Math.cos(Ad.obj.rotation.y)), .13);
    const rostoIgor = I.cabeca.getWorldPosition(v3()).add(v3(0, .05, 0));
    if (camQ) cam(camQ.slice(0, 3), camQ.slice(3, 6), camQ[6]);
    else if (t < 3.8) cam(olho.toArray(), rostoIgor.clone().lerp(v3(0, .9, .3), .3).toArray(), 52);                  // POV: entrando; o Igor vira: "Trouxeram?"
    else if (t < 6.0) cam(olho.toArray(), ALTO.clone().lerp(rostoIgor, .55).toArray(), 60);                          // POV: a maleta na mão; o Igor pega
    else if (t < 11.0) { const f = fichas[qual].position; cam([f.x + .02, Y + .62, f.z + .12], [f.x, Y, f.z], 40); }   // as pastas, uma por uma
    else cam(olho.toArray(), rostoIgor.clone().lerp(MAL_MESA, .35).toArray(), 46);                                  // POV: o Igor olha a maleta: "Então... o ARG-14."
  };
};
</script></body></html>
