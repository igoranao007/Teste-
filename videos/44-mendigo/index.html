<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 4 · O MENDIGO DE CASMIRON (37 s): Metalis chega na janela pedindo moeda; conversa com o Adryan; recebe o dinheiro;
     o carro sai e a câmera fica com ele, os faróis amarelos passam no rosto, ele acompanha o carro até sumir. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:37}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 42, perto: 14, longe: 70, luz: { keyDir: [.2, .9, .4], keyCor: '#b9d8c2', amb: '#2c4232', fillCor: '#1c5a30' } });
  const C = await V.montarPosto(S), { D, Fr, Me, bico } = C, fala = await V.vozes();
  Fr.obj.visible = false;
  const PERTO = [.45, -1.4], ATRAS = [.62, -2.05], INICIO = [1.3, -3.75], v3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...p); S.camera.lookAt(...a); S.camera.updateProjectionMatrix(); };
  const SOLEIRA = v3(.62, .98, -.95);                                         // beirada da janela do motorista (vidro abaixado)
  const olhos = V.olhosMetalis(Me); window.OLHOS = olhos; window.Me = Me; const _x = 0, moeda = V.dinheiro('moeda'); S.scene.add(moeda);
  const angLerp = (a, b, u) => { let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * u; };
  const env = (t, a, b, c, d) => P.suave(a, b, t) * (1 - P.suave(c, d, t));
  S.update = t => {
    Me.obj.visible = true;
    const sai = P.clamp((t - 32.2) / 4.6); C.naCurva(C.saida, sai ** 1.8, 0); if (t < 32.2) { D.car.position.set(0, .02, 0); D.car.rotation.y = Math.PI / 2; }
    D.car.janela(1 - P.suave(31.2, 32.0, t));                                  // vidro aberto; sobe quando ele manda o Metalis cuidar da vida
    const vA = fala('44', t, 'adryan'), vM = fala('44', t, 'metalis');
    const bolso = env(t, 23.8, 24.2, 24.3, 24.7), fora = env(t, 24.4, 25.05, 25.55, 26.1);
    D.atualizar(t, { giro: t > 32 ? .3 * P.suave(32.2, 33.5, t) : 0, falaAd: vA, bolso, maoFora: fora, janela: P.clamp((t - 30.9) / 1.2),
      olhaAd: .7 * P.suave(1.2, 1.8, t) * (1 - P.suave(23.4, 23.8, t)) - .45 * env(t, 23.5, 23.8, 24.0, 24.3) + .7 * P.suave(24.2, 24.6, t) * (1 - P.suave(31.8, 32.3, t)),
      olhaNi: .35 * P.suave(3, 3.6, t) * (1 - P.suave(31, 32, t)) });
    // METALIS — chega arrastando o pé (0,2–3,6), vira pra janela, se debruça com a mão na beirada; gesticula nas falas;
    //           pega a moeda, olha pra ela e guarda; dá um passo pra trás quando o vidro sobe; acena; acompanha o carro e os olhos acendem
    let andando = false;
    // chegada: já fora da ilha das bombas (sem desvio), passos curtos e rápidos — cadência pela passada REAL dele (0,45 m/ciclo)
    if (t < 3.7) { andando = V.caminhar(Me, INICIO, PERTO, t, .2, 3.6, { de: Math.atan2(PERTO[0] - INICIO[0], PERTO[1] - INICIO[1]), ease: .15 }); if (!andando) Me.pose('idle', t); }
    else if (t < 31.4) { Me.obj.position.set(PERTO[0], 0, PERTO[1]); Me.obj.rotation.y = angLerp(Math.atan2(PERTO[0] - INICIO[0], PERTO[1] - INICIO[1]), .32, P.suave(3.6, 4.3, t));
      Me.pose('idle', t, 'talk', .45 * fala.peso('44', t, 'metalis'), t); }
    else if (t < 34.2) { andando = V.caminhar(Me, PERTO, ATRAS, t, 31.4, 32.3, { virar: false, passo: .9 }); Me.obj.rotation.y = .32;
      if (!andando) { const w = P.suave(32.3, 32.7, t) * (1 - P.suave(33.7, 34.1, t)); Me.pose('idle', t, 'wave', w, t - 32.3); } else Me.pose('walk', -P.clamp((t - 31.4) / .9) * .67 / Me.passada * Me.dur('walk'), 'idle', 1 - Math.min(P.suave(31.4, 31.7, t), 1 - P.suave(32.0, 32.3, t)), t); }
    else { Me.obj.position.set(ATRAS[0], 0, ATRAS[1]); const c = D.car.position; Me.obj.rotation.y = angLerp(.32, Math.atan2(c.x - ATRAS[0], c.z - ATRAS[1]), P.suave(34.2, 35.2, t)); Me.pose('idle', t); }
    Me.obj.updateMatrixWorld(true);
    // debruçado na janela: tronco pra frente + mão esquerda na beirada
    const debr = env(t, 4.0, 4.9, 30.2, 31.3);
    // referencial do CORPO dele (antes os alvos eram pontos fixos do mundo, na altura do rosto → o braço cruzava a cara)
    const rMe = Me.obj.rotation.y, fM = v3(Math.sin(rMe), 0, Math.cos(rMe)), dM = v3(-Math.cos(rMe), 0, Math.sin(rMe)), OMB = Me.osso('RightArm').getWorldPosition(v3());
    // mão esquerda na beirada da janela, mas VIVA: escorrega um pouco, levanta e reapoia nas falas (antes ficava 26 s cravada)
    const ergue = [8.4, 16.4, 23.7, 29.6].reduce((m, q) => Math.max(m, env(t, q, q + .25, q + .55, q + .85)), 0);
    if (debr > 0) { V.girar(Me, 'Spine', [1, 0, 0], .05 * debr); Me.obj.updateMatrixWorld(true);
      V.ik2(Me, 'LeftArm', 'LeftForeArm', 'LeftHand', SOLEIRA.clone().add(v3(-.06 + .03 * Math.sin(t * .6), .04 * ergue, .015 * Math.sin(t * .45))), dM.clone().negate().add(v3(0, -.35, 0)).addScaledVector(fM, -.3), debr); }
    // mão direita: pede (palma pra cima, na frente do peito) · dá de ombros (pro lado) · pega a moeda · olha a moeda · guarda no bolso · comemora
    const em = (f, d, y) => OMB.clone().addScaledVector(fM, f).addScaledVector(dM, d).add(v3(0, y, 0));
    const alvos = [
      [env(t, 10.2, 10.95, 13.3, 14.0), em(.26, .06, -.12 + .02 * Math.sin(t * 3))],                 // "vai me deixar na mão?"
      [env(t, 20.4, 21.15, 22.9, 23.6), em(.14, .24 + .02 * Math.sin(t * 2.2), -.04)],                // "é a vida..." (gesto aberto pro lado)
      [env(t, 24.8, 25.4, 25.45, 25.8), D.Ad.osso('hand.L').getWorldPosition(v3())],                 // pega a moeda
      [env(t, 25.5, 26.0, 26.25, 27.0), em(.22, .02, -.16)],                                         // olha a moeda na palma (abaixo do rosto)
      [env(t, 26.3, 27.05, 27.15, 27.7), Me.obj.position.clone().addScaledVector(dM, .16).addScaledVector(fM, .03).add(v3(0, .36, 0))],   // guarda no bolso
      [env(t, 27.7, 28.3, 29.1, 29.8), em(.08, .12, .32)]];                                          // "sabia que podia contar contigo!"
    // um alvo só (média ponderada); cotovelo pra fora, pra baixo e pra trás DO CORPO dele
    let K = 0, soma = 0; const alvoM = v3(0, 0, 0); for (const [k, alvo] of alvos) if (k > 0) { K = Math.max(K, k); soma += k; alvoM.addScaledVector(alvo, k); }
    if (K > 0) V.ik2(Me, 'RightArm', 'RightForeArm', 'RightHand', alvoM.multiplyScalar(1 / soma), dM.clone().add(v3(0, -.4, 0)).addScaledVector(fM, -.3).toArray(), K);
    // cabeça: fala, olha a moeda, abaixa no fim e levanta encarando o carro
    V.falarOsso(Me, 'Head', vM, t, 1.2);
    const olhaMoeda = env(t, 25.55, 26.0, 26.35, 26.7); if (olhaMoeda > 0) V.girar(Me, 'Head', [1, 0, 0], .35 * olhaMoeda);
    // moeda: bolso do Adryan → mão dele → mão do Metalis → bolso
    moeda.visible = t > 24.2 && t < 27.12;
    if (t < 25.42) moeda.naMao(D.Ad, 'L', 1.1); else { const h = Me.osso('RightHand').getWorldPosition(v3()); moeda.position.copy(h).add(v3(0, .02, .02)); moeda.rotation.set(.6, 0, 0); moeda.scale.setScalar(1.3); }
    // olhos amarelos: só quando ele encara o carro indo embora
    const brilho = P.suave(35.1, 35.7, t); olhos.acender(brilho + (brilho > .9 ? .06 * Math.sin(t * 9) : 0), S.camera);
    // faróis no rosto dele quando o carro manobra pra sair
    const far = P.suave(32.6, 33.4, t) * (1 - P.suave(34.4, 35.6, t));
    const base = { keyDir: [.2, .9, .4], keyCor: '#b9d8c2', amb: '#2c4232', fillDir: [-.1, .2, -1], fillCor: '#1c5a30' };
    if (far > 0) P.luz({ ...base, keyDir: [1, .25, .2], keyCor: '#' + new THREE.Color('#b9d8c2').lerp(new THREE.Color('#ffd23a'), far).multiplyScalar(1 + far * .6).getHexString() });
    else P.luz(base);
    // câmeras: variar os enquadramentos (não repetir o mesmo close)
    const mp = Me.obj.position, th = Me.obj.rotation.y, fr = [Math.sin(th), Math.cos(th)];
    const ROSTO_M = [mp.x, .82, mp.z], frente = (d, lado, y) => [mp.x + fr[0] * d + fr[1] * lado, y, mp.z + fr[1] * d - fr[0] * lado];
    const q = fala.quem('44', t);
    if (t < 3.9) cam([3.3, 1.45, .7], [mp.x * .5 + .9, .7, mp.z * .5 - 1.4], 44);                          // ele chegando, chamando o Adryan
    else if (t < 7.3) cam([1.3, .82, -1.05], [.46, .84, -1.25], 46);                                           // de dentro do carro, pela janela aberta
    else if (t < 10.1) cam([1.25, 1.65, -2.85], [.22, 1.05, -.4], 34);                                        // Adryan respondendo (por cima do Metalis)
    else if (t < 14.5) cam([1.2, .8, -1.12], [.46, .85, -1.26], 36);                                                     // Metalis pedindo (close pela janela)
    else if (t < 20.2) cam([-.45, 1.6, -2.75], [.25, 1.05, -.4], 34);                                         // Adryan (do outro lado)
    else if (t < 23.4) cam([1.15, .78, -1.0], [.46, .84, -1.24], 40);                                         // Metalis pela janela, de dentro (mais perto)
    else if (t < 24.4) cam([2.7, 1.25, .1], [.27, 1.0, 0], 40);                                              // Adryan olha o Nicolas
    else if (t < 27.4) cam([-.75, 1.2, -1.3], [.42, .92, -1.1], 42);                                         // a moeda passando
    else if (t < 30.0) cam([1.4, .9, -1.3], [.46, .86, -1.25], 44);                                                    // Metalis feliz (pela janela, do outro lado)
    else if (t < 31.8) cam([-.2, 1.35, -2.4], [.25, 1.0, -.6], 40);                                           // "vai cuidar da tua vida" + vidro subindo
    else if (t < 34.2) cam([2.2, 1.15, -3.9], ROSTO_M, 44);                                                  // o carro sai, faróis no rosto
    else { const u = P.suave(34.2, 37, t); cam(frente(P.lerp(1.5, 1.0, u), P.lerp(.55, .25, u), .9), ROSTO_M, P.lerp(40, 32, u)); }   // fica com ele: os olhos acendem
    C.halos(S.camera);
    window.dbgCam = () => { const r = new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(0, 0), S.camera); const h = r.intersectObjects(S.scene.children, true).slice(0, 3); return [S.camera.position.toArray(), h.map(x => [x.object.name, x.distance])]; };
  };
};
</script></body></html>
