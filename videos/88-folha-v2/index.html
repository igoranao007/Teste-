<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Folha do ELENCO v2 (animações novas u_/m_): ?p=<nome do ELENCO> ou p=igor | p=dod (cabeça montada no motor, lib/tgp.js)
     &clip=u_Walk_Loop &v=frente|tres|lado|costas|rosto &t=segundos — usado por tools/folha_elenco.mjs (PAGINA=88-folha-v2) -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:4}</script>
<script src="../../lib/boot.js"></script></head><body><div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const q = new URLSearchParams(location.search), nome = q.get('p') || 'igor', clip = q.get('clip') || 'u_Idle_Loop';
  const S = P.palco({ fov: 30, cam: [0, 1, 5], alvo: [0, 1, 0], fundo: q.get('fundo') || '#1a1a1c',
    luz: { keyDir: [-.4, .7, .8], keyCor: '#f2efe6', fillDir: [.8, .2, .3], fillCor: '#6a7078', amb: '#626a66' } });
  S.scene.add(P.caixa(6, .02, 6, P.mat({ cor: '#2a2a2c' }), { pos: [0, -.01, 0] }));
  let obj, pose, osso;
  if (nome === 'igor' || nome === 'dod') {
    const X = nome === 'igor' ? await T.igor({ anim: true }) : await T.dod({ anim: true });
    obj = X.obj; osso = X.corpo.osso; pose = t => { X.corpo.clip(clip, t); X.assentar?.(); X.animar?.(t); };
  } else { const A = await E4.ator(nome); obj = A.obj; osso = A.osso; pose = t => A.pose(clip, t); }
  S.scene.add(obj); pose(+(q.get('t') || 1)); obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj), h = Math.max(1, b.max.y);
  const cab = (osso('spine.005') || osso('Head')).getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, .1, 0));
  const V = { frente: [0, h * .55, 4.4, 0, h * .5, 0, 30], tres: [2.5, h * .62, 3.6, 0, h * .5, 0, 30], lado: [4.4, h * .55, 0, 0, h * .5, 0, 30],
    costas: [-1.2, h * .6, -4.2, 0, h * .5, 0, 30], rosto: [cab.x, cab.y + .02, cab.z + .9, cab.x, cab.y - .02, cab.z, 24] }[q.get('v') || 'tres'];
  S.update = t => { pose(t);
    S.camera.fov = V[6]; S.camera.position.set(V[0], V[1], V[2]); S.camera.lookAt(V[3], V[4], V[5]); S.camera.updateProjectionMatrix(); };
};
</script></body></html>
