<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Exemplo 4 · kit de terror (lib/arh.js) em 16:9: câmera de segurança fixa no alto de uma praça à noite,
     bonecos sem rosto andando (luz assada de novo a cada quadro), imagem em 12 qps, cinza, com scanline, REC e timecode. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:6}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}#stage canvas{filter:grayscale(.88) contrast(1.18) brightness(1.15)}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
const { THREE } = P;

const S = P.palco({ fov: 56, cam: [9.5, 7.2, 9.5], alvo: [-.5, 0, -1.5], fundo: '#0d0f12', nevoa: { cor: '#0d0f12', perto: 16, longe: 34 } });
const cena = S.scene, cam = S.camera, R = P.rng(14);

const pedra = P.textura(32, 32, (x, w, h, r) => {
  x.fillStyle = '#7d7a73'; x.fillRect(0, 0, w, h);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 2; i++) { x.fillStyle = ['#86837b', '#76736c', '#807d75'][Math.floor(r() * 3)]; x.fillRect(i * 16 + (j % 2) * 8, j * 8, 15, 7); }
}, { seed: 3 });
cena.add(A.chaoA({ tam: 44, seg: 96, mapa: pedra, rep: [22, 22] }));

// quiosque fechado, canteiros e postes
const lata = A.matA({ cor: '#8d9092' }), escuro = A.matA({ cor: '#3a3c40' }), folha = A.matA({ cor: '#3e4a40' }), muro = A.matA({ cor: '#a29d92' });
cena.add(P.caixa(2.4, 2.2, 1.8, lata, { pos: [-4.2, 1.1, -3.6], sy: 2 }));
cena.add(P.caixa(2.9, .1, 2.3, escuro, { pos: [-4.2, 2.3, -3.6] }));
for (const [x, z] of [[2.5, -6.5], [-7.5, 2.5], [7, -2.5], [-1, -9]]) {
  cena.add(P.cilindro(1.1, 1.1, .5, muro, { pos: [x, .25, z], seg: 10 }));
  cena.add(P.esfera(.95, folha, { pos: [x, .85, z], seg: 7, segV: 5, esc: [1, .7, 1] }));
}
for (let i = 0; i < 7; i++) cena.add(P.caixa(.5, .45, .5, muro, { pos: [-12 + i * 1.6, .22, 8.5] }));   // balizadores
const postes = [];
for (const [x, z] of [[-6, -6], [5, -8], [-7, 5], [1.5, 2.8], [0, -14]]) { const p = A.poste(x, z, { h: 4.2, raio: 7.5, int: 1.6 }); cena.add(p); postes.push(p); }
const luzes = postes.map(p => p.luz());
A.assar(cena, luzes, '#30343a');

// gente sem rosto atravessando a praça (todos adultos, ninguém identificável)
const ROUPAS = ['#4c5057', '#6a6d72', '#35383d', '#7c7a74', '#55606a', '#5e5249'];
const gente = new THREE.Group(); cena.add(gente);
const andam = [];
for (let i = 0; i < 26; i++) {
  const b = A.boneco({ roupa: ROUPAS[Math.floor(R() * ROUPAS.length)], esc: .95 + R() * .12 });
  const ang = R() < .5 ? R() * .5 - .25 + (R() < .5 ? 0 : Math.PI) : Math.PI / 2 + (R() < .5 ? 0 : Math.PI) + R() * .4 - .2;
  andam.push({ b, x0: (R() - .5) * 20, z0: (R() - .5) * 20, dx: Math.sin(ang), dz: Math.cos(ang), v: .9 + R() * .45, off: R() * 24, fase: R() * 6 });
  gente.add(b);
}
for (const [x, z, r] of [[1.6, 1.2, 2.2], [2.2, 1.5, -1], [-2, 5.4, .4]]) { const b = A.boneco({ roupa: ROUPAS[Math.floor(R() * 6)] }); b.position.set(x, 0, z); b.rotation.y = r; gente.add(b); }   // parados conversando

const L = 24;
S.update = t => {
  const tq = Math.floor(t * 12) / 12;                       // câmera de segurança: 12 quadros por segundo
  for (const a of andam) {
    const s = ((tq * a.v + a.off) % L) - L / 2;
    a.b.position.set(a.x0 + a.dx * s, 0, a.z0 + a.dz * s);
    a.b.rotation.y = Math.atan2(a.dx, a.dz);
    a.b.andar(tq * a.v * 5.5 + a.fase);
  }
  A.assar(gente, luzes, '#3a3e45');
};

A.hud({ cam: 'CAM 04', dir: '[DATE]', tc0: 0, fita: true });
cue('chiado', 0, { d: 6 });
</script></body></html>
