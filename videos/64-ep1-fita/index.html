<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EPISÓDIO 1 (reformulado) · CENA 64 · A FITA ARG-14 EM POV DO ADRYAN (versão nova do plano 53, que fica intacto). Pelos olhos do Adryan:
     o Igor abre a maleta (dois estalos), brilho verde no rosto; dentro, a fita VHS; close na fita: "Então é isso. O ARG-14."; ele pega a fita.
     ?cam=x,y,z,ax,ay,az,fov (inspeção) -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:12}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({ fov: 36, cam: [0, 1, 1.75], alvo: [0, 1.02, 0], fundo: '#020604', nevoa: { cor: F.SOMBRA, perto: 3, longe: 12 }, luz: F.LUZ_SALA }), cena = S.scene;
  const sala = await V.salaIgor4(cena), { I, Y, lamp } = sala, fala = await V.vozes('ep1'); S.camera.near = .03;
  const q = new URLSearchParams(location.search), camQ = q.get('cam')?.split(',').map(Number);
  const Ad = await E4.ator('adryan'), Gu = await E4.ator('gusta'); cena.add(Ad.obj, Gu.obj);
  Ad.obj.position.set(-.12, 0, 1.32); Ad.obj.rotation.y = Math.PI; Gu.obj.position.set(-.95, 0, 1.62); Gu.obj.rotation.y = Math.PI + .35;   // onde pararam na cena 63
  const mal = T.maleta(); cena.add(mal); const fita = await T.fitaVHS(); mal.dentro.add(fita);
  const MESA = new THREE.Vector3(-.05, Y, .52), V3 = (x, y, z) => new THREE.Vector3(x, y, z);
  mal.position.copy(MESA); mal.deitar(1); cena.updateMatrixWorld(true); const FR = fita.getWorldPosition(V3(0, 0, 0));
  const chi = F.chiadoVerde();
  S.update = t => {
    sala.video(t + 27); I.girar(0);
    Ad.pose('idle', t); Gu.pose('idle', t + .5); V.girar(Gu, 'spine.005', [1, 0, 0], .2 * P.suave(2, 3, t));
    const abre = P.suave(1.0, 2.0, t), maos = P.suave(.2, .8, t) * (1 - P.suave(2.1, 2.6, t)), pega = t >= 8.6, close = t >= 3.2 && t < 8.6;
    const m = {};
    if (maos > 0) { m.R = [MESA.x - .13, Y + .135, MESA.z - .03]; m.L = [MESA.x + .13, Y + .135, MESA.z - .03]; m.kR = m.kL = maos; }
    if (pega) { const a = P.suave(8.6, 9.6, t), s = P.suave(9.8, 11.6, t);
      const mao = V3(P.lerp(-.02, FR.x, a), P.lerp(Y + .3, FR.y + .05, a) + s * .34, P.lerp(.3, FR.z, a) - s * .3);
      m.R = mao.toArray(); m.poloR = [-.8, .2, -.5]; m.kR = P.suave(8.6, 9.1, t);
    }
    m.pegada = { R: { dedos: [0, -.5, 1], indice: [1, 0, 0] }, L: { dedos: [0, -.5, 1], indice: [-1, 0, 0] } };   // palmas pra baixo na maleta / na fita
    m.inclina = .16; const v = fala('64', t, 'igor'); I.pose(t, m); I.animar(t, { boca: v, pisca: (t % 4.1) > 3.95 ? 1 : 0 });
    // a fita vai NA PALMA de verdade (antes ia pro alvo do IK e ficava flutuando quando o braço não alcançava)
    const segura = pega ? P.suave(9.6, 9.85, t) : 0;
    if (segura <= 0) { if (fita.parent !== mal.dentro) mal.dentro.add(fita); fita.position.set(0, 0, 0); fita.rotation.set(0, 0, 0); }
    else { I.obj.updateMatrixWorld(true); const c = I.corpo, h = c.osso('hand.R').getWorldPosition(V3(0, 0, 0)), md = c.osso('f_middle.01.R'), palma = md ? h.clone().lerp(md.getWorldPosition(V3(0, 0, 0)), .6) : h;
      const s2 = P.suave(9.8, 11.6, t); if (fita.parent !== cena) cena.attach(fita);
      fita.position.copy(FR.clone().lerp(palma.add(V3(0, -.035, 0)), segura)); fita.rotation.set(-Math.PI / 2 + s2 * .4, 0, .12 * s2); }
    I.cabeca.rotation.x += .34; I.cabeca.rotation.y += -.18;   /* olha pra maleta sem 'quebrar' o pescoço (antes .52/−.3 + cabeça deslocada: parecia solta) */
    mal.abrir(abre * 1.85); mal.brilho(abre); mal.pulsar(t);
    const g = abre * (.75 + .25 * Math.sin(t * 9));
    V.luzSalaVerde(sala, t, S.camera, { fillDir: [-.3, -.4, .85], fillCor: '#' + new THREE.Color('#16321f').lerp(new THREE.Color('#39ff6a'), g * .45).getHexString() });   // sala verde + brilho da maleta
    S.camera.up.set(0, close ? 0 : 1, close ? -1 : 0);
    Ad.obj.updateMatrixWorld(true);
    const olho = Ad.osso('spine.005').getWorldPosition(V3(0, 0, 0)).add(V3(0, .08, -.13)), rosto = I.cabeca.getWorldPosition(V3(0, 0, 0));
    if (camQ) { S.camera.fov = camQ[6]; S.camera.position.set(...camQ.slice(0, 3)); S.camera.lookAt(...camQ.slice(3, 6)); }
    else if (t < 3.2) { S.camera.fov = 48; S.camera.position.copy(olho); S.camera.lookAt(rosto.clone().lerp(MESA, .38)); S.camera.fov = 52; }   // POV do Adryan: o Igor abre a maleta
    else if (close) { const q = P.clamp((t - 3.2) / 5.4); S.camera.fov = 34; S.camera.position.set(FR.x + .01, FR.y + .5 - q * .08, FR.z + .05); S.camera.lookAt(FR.x, FR.y, FR.z); }
    else { S.camera.fov = 46; S.camera.position.copy(olho); S.camera.lookAt(rosto.clone().lerp(MESA, .3)); S.camera.fov = 50; }   // POV: ele pega a fita e olha pra ela
    S.camera.updateProjectionMatrix();
    I.cabeca.visible = !close; I.pescoco.visible = !close; lamp.visible = !close;
    chi.desenha(Math.round(t * 30), close ? .1 : 0, { dens: .25 });
  };
};
</script></body></html>
