<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 8 · A SENHA (10 s): Adryan bate na porta; close na maçaneta; porta entreaberta, Gusta: "Senha?"; Adryan: "15/03 007 BIFF.";
     Gusta observa, a expressão muda, abre a porta: "Pode entrar." (a voz do Gusta entra depois; por enquanto legenda) -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:10}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 40, perto: 8, longe: 45, luz: { keyDir: [.3, .7, .7], keyCor: '#a8cdb2', amb: '#22382a', fillCor: '#1c5a30' } }), cena = S.scene;
  const { cab } = await V.montarCabana(S);
  const car = await F.carro(); car.position.set(0, .02, 8.6); car.rotation.y = Math.PI; car.luzes(0); cena.add(car);
  const Ad = await E4.ator('adryan'), Gu = await E4.ator('gusta'); cena.add(Ad.obj, Gu.obj); T.poses(Ad.modelo);
  const mal = T.maleta(); mal.scale.setScalar(.72); cena.add(mal);
  const fala = await V.vozes(), v3 = (x, y, z) => new THREE.Vector3(x, y, z);
  const PORTA = new THREE.Vector3(-1.2, 0, 2.8), MAC = () => cab.macaneta.getWorldPosition(v3());
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...p); S.camera.lookAt(...a); S.camera.updateProjectionMatrix(); };
  S.update = t => {
    const abre = .42 * P.suave(2.6, 3.1, t) + .58 * P.suave(8.1, 9.0, t); cab.abrir(abre);
    // Adryan diante da porta, maleta na direita; bate com a esquerda (0,9–2,1)
    Ad.obj.position.set(-1.2, 0, 3.6); Ad.obj.rotation.y = Math.PI; Ad.pose('idle', t);
    const bate = t > .9 && t < 2.1 ? Math.max(0, Math.sin((t - .9) * Math.PI * 2.5)) : 0;
    const kb = P.suave(.55, .95, t) * (1 - P.suave(2.05, 2.45, t)); if (kb > 0) { Ad.obj.updateMatrixWorld(true); const h = Ad.osso('hand.L').getWorldPosition(new THREE.Vector3()); Ad.modelo.alcancar('L', h.lerp(new THREE.Vector3(-1.45, 1.4, 2.95 - .07 * bate), kb).toArray(), [-.8, -.6, .3], .05); }
    const v = fala('48', t, 'adryan'); V.falar(Ad, v, t);
    if (t > 9.2) V.caminhar(Ad, [-1.2, 3.6], [-1.2, 1.2], t, 9.2, 10.6, { de: Ad.obj.rotation.y });
    Ad.obj.position.y = V.chao(Ad.obj.position.x, Ad.obj.position.z, cab.plataformas);          // sobe o degrau da varanda (não atravessa)
    V.segurarMaleta(Ad, mal, t); mal.pulsar(t);
    // Gusta lá dentro, aparece pela fresta (do lado da maçaneta); levanta o queixo quando ouve a senha; depois abre
    // fora do arco da porta (raio 1,04 m da dobradiça): olha pela fresta; dá um passo pra trás quando abre de vez
    const recua = V.caminhar(Gu, [-.7, 2.0], [-.15, 1.35], t, 8.1, 9.35, { virar: false }); Gu.obj.rotation.y = 0; Gu.obj.position.y = .08;
    if (!recua) Gu.pose('idle', t, 'talk', .7 * fala.peso('48', t, 'gusta'), t);
    V.girar(Gu, 'spine.005', [1, 0, 0], -.1 * P.suave(6.4, 7.2, t));
    if (t < 2.4) cam([1.8, 1.7, 7.2], [-1.2, 1.3, 3.0], 38);                                             // ele bate
    else if (t < 3.2) cam([-.25, 1.15, 3.45], MAC().toArray(), 34);                                       // maçaneta; a porta abre um pouco
    else if (t < 4.7) cam([-.55, 1.72, 4.5], [-.9, 1.62, 2.05], 30);                                       // pela fresta: Gusta "Senha?"
    else if (t < 7.6) cam([-.72, 1.6, 2.82], [-1.2, 1.58, 3.6], 44);                                      // de dentro, por cima do ombro do Gusta: a senha
    else if (t < 9.2) cam([-.8, 1.78, 4.6], [-.9, 1.5, 2.05], 40);                                        // a porta abre: "Pode entrar."
    else cam([1.5, 1.8, 6.6], [-1.2, 1.2, 2.6], 40);
    cab.halo.quaternion.copy(S.camera.quaternion);
  };
};
</script></body></html>
