<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- ferramenta: mede em que fração do ciclo 'walk' cada pé toca o chão (pros sons de passo caírem no contato real) -->
<script>VIDEO={w:640,h:360,fps:30,dur:1}</script>
<script src="../../lib/boot.js"></script></head><body><div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as E4 from '../../lib/elenco4.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({}); const out = {};
  for (const nome of ['adryan', 'gusta', 'nicolas', 'frentista', 'metalis']) {
    const A = await E4.ator(nome); S.scene.add(A.obj); const d = A.dur('walk'), N = 120, ys = { L: [], R: [] };
    const pe = s => A.osso(nome === 'metalis' ? (s === 'L' ? 'LeftFoot' : 'RightFoot') : 'foot.' + s);
    for (let i = 0; i < N; i++) { A.pose('walk', d * i / N); A.obj.updateMatrixWorld(true); for (const s of ['L', 'R']) ys[s].push(pe(s).getWorldPosition(new THREE.Vector3()).y); }
    // contato = começo do apoio: primeiro quadro em que o pé desce até perto do mínimo (5% da amplitude)
    const c = {}; for (const s of ['L', 'R']) { const y = ys[s], mn = Math.min(...y), mx = Math.max(...y), lim = mn + (mx - mn) * .08;
      for (let i = 0; i < N; i++) if (y[i] <= lim && y[(i - 1 + N) % N] > lim) { c[s] = +(i / N).toFixed(3); break; } }
    // passada: na fase de apoio o pé anda pra trás em relação ao corpo; o corpo avança 2× isso por ciclo (2 passos)
    const zs = { L: [], R: [] }; for (let i = 0; i < N; i++) { A.pose('walk', d * i / N); A.obj.updateMatrixWorld(true); for (const s of ['L', 'R']) zs[s].push(A.obj.worldToLocal(pe(s).getWorldPosition(new THREE.Vector3())).z * A.obj.scale.z); }
    const amp = s => Math.max(...zs[s]) - Math.min(...zs[s]), escala = A.obj.scale.x;
    out[nome] = { ...c, dur: +d.toFixed(3), passada: +(((amp("L") + amp("R")) / 2) * 2).toFixed(3), k: +(A.obj.children[0]?.scale.x ?? 1).toFixed(3) }; S.scene.remove(A.obj);
  }
  window.PES = out; S.update = () => {};
};
</script></body></html>
