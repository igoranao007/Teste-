<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EPISÓDIO 1 · CENA 73 · BASE — LOCAL: ???? (nova, 63 s). Tela preta → letreiro. O DOM sentado: NÃO DÁ PRA VER O VISUAL DELE — só os BRAÇOS
     apoiados na mesa, mãos entrelaçadas na frente do rosto (referência: pose_dom_bracos_apoiados.jpg); o rosto fica na sombra; ele SEMPRE MEXE
     O BRAÇO QUANDO FALA. O TELÃO com o MAPA DA ILHA DE BARLOTH parado em CASMIRON. Ao lado, OLIVEIRA e LUAN — o diálogo completo de
     MINISSERIE_NOTAS.md §4b (itens 21–30). Termina em "Quem?" e corta. Legendas na cena (?leg=0 tira). ?cam= força câmera. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:63}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}
.letreiro{position:absolute;left:0;right:0;top:42%;text-align:center;color:#ffd23a;font:800 52px 'JetBrains Mono',monospace;letter-spacing:.2em;text-shadow:0 0 18px rgba(255,210,58,.5)}
.letreiro small{display:block;font-size:30px;letter-spacing:.35em;color:#fff3c4;margin-top:10px}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as T from '../../lib/tgp.js';
import * as E from '../../lib/ep1.js';
import * as E4 from '../../lib/elenco4.js';
const { THREE } = P;
window.SETUP = async () => {
  const qs = new URLSearchParams(location.search), camQ = qs.get('cam')?.split(',').map(Number);
  const S = P.palco({ fov: 42, cam: [0, 1.6, 4], alvo: [0, 1, 0], fundo: '#010101', nevoa: { cor: '#010101', perto: 5, longe: 13 }, luz: { keyDir: [1, .3, 0], keyCor: '#7a6a3a', fillDir: [-1, .2, .2], fillCor: '#141008', amb: '#0b0b0a' } }), cena = S.scene;
  const BUNK = 'material/modelos/itch/minisserie/juggypuggy__low-poly-psx-bunker-pack/PSXPack_SovietBunker_01 _2_/PSXPack_SovietBunker_01/GLB/';
  const bk = async (n, pos, rot = 0) => { const c = await V.peca(BUNK + 'SM_' + n + '.glb', { tex: 256, verde: false, mat: { lados: THREE.DoubleSide } }); c.position.set(...pos); c.rotation.y = rot; cena.add(c); return c; };
  // sala escura: piso, paredes; o telão na parede +x; a mesa do Dom no lado −x; uma poltrona escura; caixas no canto
  for (const x of [-2, 2]) for (const z of [-2, 2]) await bk('Env_FloorConcrete_01', [x, 0, z]);
  for (const z of [-2, 2]) { await bk('Env_WallConcrete_01', [4, 0, z], -Math.PI / 2); await bk('Env_WallConcrete_01', [-4, 0, z], Math.PI / 2); }
  for (const x of [-2, 2]) { await bk('Env_WallConcrete_01', [x, 0, -4]); await bk('Env_WallConcrete_01', [x, 0, 4], Math.PI); }
  const TM = await E.telaoMapa(3.2, 1.8); TM.malha.position.set(3.9, 1.6, 0); TM.malha.rotation.y = -Math.PI / 2; cena.add(TM.malha);
  const mesa = await E.prop('metal_office_desk', { pos: [-2.0, 0, 0], rot: Math.PI / 2, esc: .62 }); cena.add(mesa);
  await bk('Prop_CrateAmmo_01', [-3.4, 0, 3.2], .3); await bk('Prop_FileCabinet_01', [-3.5, 0, -3.2], .2);
  // DOM: modelo novo, sem bastão; sentado atrás da mesa, de frente pro telão (+x)
  const Dm = await E4.ator('dom'); cena.add(Dm.obj); T.poses(Dm.modelo); const DD = await T.acessoriosDom(Dm, { bastao: false });
  const DOM = [-2.55, 0, 0];
  // a SOMBRA que esconde o visual dele (rosto, chapéu, peito): plano preto com borda de baixo esfumada, sempre entre a câmera e o peito
  const somb = P.textura(16, 32, (x, w, h) => { const gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(1,1,1,1)'); gr.addColorStop(.8, 'rgba(1,1,1,1)'); gr.addColorStop(1, 'rgba(1,1,1,0)'); x.fillStyle = gr; x.fillRect(0, 0, w, h); }, { niveis: 0 });
  const sombra = P.malha(new THREE.PlaneGeometry(1.4, 1.4), P.mat({ mapa: somb, cor: '#000000', opac: .97, semLuz: true, lados: THREE.DoubleSide })); cena.add(sombra);
  const Ol = await E4.ator('oliveira'), Lu = await E4.ator('luan'); cena.add(Ol.obj, Lu.obj);
  const OL = [3.05, 0, -2.05], LU = [3.1, 0, 2.0];                                  // dos dois lados do telão, de frente pra sala
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z), angLerp = V.angLerp, env = (t, a, b, c, d) => P.suave(a, b, t) * (1 - P.suave(c, d, t));
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...p); S.camera.lookAt(...a); S.camera.updateProjectionMatrix(); };
  const letreiro = document.createElement('div'); letreiro.className = 'letreiro'; letreiro.innerHTML = 'BASE<small>LOCAL: ????</small>'; document.getElementById('stage').appendChild(letreiro);
  const preto = F.camada('background:#000');
  const C = [
    [4.5, 6.6, 'OLIVEIRA', 'Casmiron City? Sério?'],
    [7.0, 11.6, 'LUAN', 'Não esperava que o Igor iria se esconder justo nesta cidade que ele odiava tanto.'],
    [12.8, 19.3, 'OLIVEIRA', 'Então quer dizer que o Igor tem apoio da máfia casmirenha? Eles não se odiavam? Por que a máfia permitiu ele estar nesta cidade?'],
    [20.2, 25.6, 'DOM', 'Vocês já tiveram contato com o Igor. Eu esperava que vocês soubessem que ele faz de tudo em prol dos seus objetivos.'],
    [25.6, 31.2, 'DOM', 'Entenda: se for pra se aliar a um satanás, ele se alia. Pra ele não existem limites éticos.'],
    [31.8, 37.8, 'LUAN', 'Dom, já que sabemos a localidade, podemos matar ele, né? Eu e o Oliveira podemos ir agora pra Casmiron City.'],
    [38.2, 43.2, 'DOM', 'Não, não, não, não. Eu não quero que matem o Igor. Ele precisa ser capturado vivo.'],
    [43.6, 48.1, 'OLIVEIRA', 'Mas, senhor Dom, por que insiste em deixar o Igor vivo? Sabe que isso é arriscado!'],
    [49.2, 53.2, 'DOM', 'Eu preciso que ele esteja errado... e ele está errado.'],
    [53.6, 56.0, 'OLIVEIRA', 'Então... podemos ir agora?'],
    [56.4, 60.0, 'DOM', 'Não. Já chamei certas pessoas para esta operação.'],
    [60.4, 61.6, 'LUAN', 'Quem?']];
  const leg = E.legendas(C);
  const fala = (q, t) => { let v = 0; for (const [a, b, w] of C) if (w === q) v = Math.max(v, env(t, a, a + .15, b - .15, b)); return v; };
  S.update = t => {
    TM.atualizar(t); leg(t);
    const vO = fala('OLIVEIRA', t), vL = fala('LUAN', t), vD = fala('DOM', t), boca = v => v * (.5 + .5 * Math.sin(t * 15));
    // luz: só o telão (amarelo-esverdeado) ilumina; o resto é breu
    P.luz({ keyDir: [1, .25, 0], keyCor: '#' + new THREE.Color('#8a7a3e').multiplyScalar(.85 + .15 * Math.sin(t * 3)).getHexString(), fillDir: [-1, .35, .15], fillCor: '#3a3220', amb: '#0c0c0a' });
    // DOM: mãos entrelaçadas na frente do rosto, cotovelos na mesa; quando fala, a mão direita sai e gesticula; em 20,2 muda de posição
    Dm.obj.position.set(...DOM); Dm.obj.rotation.y = Math.PI / 2 + .35 * env(t, 37.6, 38.3, 43.3, 44) * 0; Dm.pose('u_Sitting_Idle_Loop', 0); Dm.obj.updateMatrixWorld(true);
    const peito = Dm.osso('spine.003').getWorldPosition(v3()), fr = v3(1, 0, 0), di = v3(0, 0, 1);
    const muda = P.suave(20.0, 20.8, t), inclina = .12 * muda;                        // "intervém mudando de posição": inclina pra frente, cotovelos mais abertos
    const juntas = peito.clone().addScaledVector(fr, .3 + .08 * muda).add(v3(0, .28 - .06 * muda, 0));
    const gesto = Math.min(1, vD * 1.6), g = Math.sin(t * 2.3) * .5 + .5;
    const R = juntas.clone().addScaledVector(di, -.03).lerp(juntas.clone().addScaledVector(di, -.28).addScaledVector(fr, .12 + .08 * g).add(v3(0, -.12 + .1 * g, 0)), gesto);
    const L = juntas.clone().addScaledVector(di, .03);
    if (inclina) V.girar(Dm, 'spine.002', [0, 0, 1], -inclina);
    Dm.modelo.alcancar('R', R.toArray(), [0, -1, -.6], .06); Dm.modelo.alcancar('L', L.toArray(), [0, -1, .6], .06);
    DD.atualizar(t, { boca: boca(vD), pisca: 0 });
    { const cab = Dm.osso('spine.005'); cab.scale.setScalar(.0001); Dm.obj.updateMatrixWorld(true); }   // o rosto/chapéu do Dom NUNCA aparece
    // OLIVEIRA e LUAN: olham o telão; se olham; o Oliveira vira pro Dom; o Luan analisa a tela e depois vira pro Dom
    const praTelaO = Math.atan2(3.9 - OL[0], 0 - OL[2]) - .9, praTelaL = Math.atan2(3.9 - LU[0], 0 - LU[2]) + .9, praDom = Math.atan2(DOM[0] - OL[0], DOM[2] - OL[2]), entre = (a, b) => Math.atan2(b[0] - a[0], b[2] - a[2]);
    const seOlham = Math.max(env(t, 11.6, 12.0, 12.6, 13.0), env(t, 48.1, 48.4, 49.0, 49.4));
    const olDom = Math.max(env(t, 19.3, 19.9, 99, 100) * (1 - env(t, 48.1, 48.4, 49.0, 49.4)), 0), olPensa = env(t, 53.4, 53.8, 55.6, 56.2);
    Ol.obj.position.set(...OL); Ol.obj.rotation.y = angLerp(angLerp(angLerp(praTelaO, praDom, olDom), entre(OL, LU), seOlham), praDom - 2.4, olPensa);
    Ol.pose('u_Idle_Loop', t, 'u_Idle_Talking_Loop', vO > 0 ? .8 : 0, t);
    const luDom = env(t, 31.2, 31.8, 99, 100) * (1 - env(t, 48.1, 48.4, 49.0, 49.4)), luTela = env(t, 19.3, 19.8, 31.0, 31.4);
    Lu.obj.position.set(...LU); Lu.obj.rotation.y = angLerp(angLerp(angLerp(praTelaL, entre(LU, OL), seOlham), entre(LU, [DOM[0], 0, DOM[2]]), luDom), praTelaL + .5, luTela);
    Lu.pose('u_Idle_Loop', t + .7, 'u_Idle_Talking_Loop', vL > 0 ? .8 : 0, t);
    Ol.obj.updateMatrixWorld(true); Lu.obj.updateMatrixWorld(true);
    if (vO) V.falar(Ol, boca(vO), t); if (vL) V.falar(Lu, boca(vL), t);
    if (luTela > 0) V.girar(Lu, 'spine.005', [1, 0, 0], .08 * Math.sin(t * .9) * luTela);
    // letreiro e cortes
    letreiro.style.opacity = (P.suave(.4, 1.0, t) * (1 - P.suave(3.2, 3.8, t))).toFixed(2); preto.style.opacity = Math.max(1 - P.suave(3.6, 4.2, t), P.suave(61.9, 62.1, t)).toFixed(2);
    // câmeras
    const cabO = Ol.osso('spine.005').getWorldPosition(v3()), cabL = Lu.osso('spine.005').getWorldPosition(v3()), maos = juntas.clone();
    let alvoS = null;
    if (camQ) cam(camQ.slice(0, 3), camQ.slice(3, 6), camQ[6]);
    else if (t < 7.0) { const u = P.suave(3.6, 7, t); cam([P.lerp(-3.7, -3.4, u), 1.75, P.lerp(.9, .7, u)], [3.9, 1.5, -.1], 42); alvoS = 'costas'; }   // por trás do Dom: o telão, os dois
    else if (t < 12.8) cam([.2, 1.6, 0], [(cabO.x + cabL.x) / 2, 1.5, (cabO.z + cabL.z) / 2], 40);                                    // Oliveira e Luan
    else if (t < 19.3) cam([1.5, 1.85, -1.1], cabO.toArray(), 36);                                                                       // o Oliveira: a máfia casmirenha
    else if (t < 31.2) { cam([-1.55, .92, -.55], maos.clone().add(v3(0, -.1, 0)).toArray(), 30); alvoS = 'frente'; }                                               // o DOM: só os braços (o rosto na sombra)
    else if (t < 38.0) cam([1.6, 1.5, 1.1], cabL.toArray(), 36);                                                                        // o Luan: "podemos matar ele, né?"
    else if (t < 43.4) { cam([-1.6, .95, .5], maos.clone().add(v3(0, -.1, 0)).toArray(), 30); alvoS = 'frente'; }                                                // o Dom: "não, não, não, não"
    else if (t < 49.2) cam([.0, 1.6, 0], [(cabO.x + cabL.x) / 2, 1.55, (cabO.z + cabL.z) / 2], 50);                                  // o Oliveira insiste; os dois se olham
    else if (t < 53.4) { cam([-1.5, .9, -.35], maos.clone().add(v3(0, -.1, 0)).toArray(), 26); alvoS = 'frente'; }                                                 // "eu preciso que ele esteja errado"
    else if (t < 56.3) cam([1.6, 1.8, -1.0], cabO.toArray(), 38);                                                                        // o Oliveira se revira: "então... podemos ir agora?"
    else if (t < 60.3) { cam([-1.4, .92, .3], maos.clone().add(v3(0, -.1, 0)).toArray(), 24); alvoS = 'frente'; }                                                // "já chamei certas pessoas"
    else cam([1.7, 1.5, 1.2], cabL.toArray(), 32);                                                                                      // "Quem?"
    // a sombra fica entre a câmera e o peito do Dom (de frente) — de costas a silhueta já é preta contra o telão
    const pe = Dm.osso('spine.004').getWorldPosition(v3()), cp = S.camera.position.clone();
    if (alvoS === 'frente') { const d = pe.clone().sub(cp); const pos = cp.clone().addScaledVector(d, .78); pos.y = pe.y + .43; sombra.position.copy(pos); sombra.lookAt(cp); sombra.visible = true; }
    else sombra.visible = false;
  };
};
