<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v5 PLANO 16 · O CHIADO (7 s): o carregamento falha — chiado verde, tracking, rasgos; em 4,2 s o chiado vira AMARELO forte do nada e aparece
     o aviso "LOCAL DESCOBERTO" piscando (o Dom achou a Toca). Continua no plano 58 (o Igor e o Dom). -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:7}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from "../../lib/ps1.js";
import * as A from "../../lib/arh.js";
import * as F from "../../lib/filme.js";
import * as T from "../../lib/tgp.js";
import * as K from "../../lib/terminal.js";
const { THREE } = P;
window.SETUP = async () => {
  const term = K.terminal(), flash = F.camada('background:#d8ffe2'), preto = F.camada('background:#000');
  
  window.onTick(t => {
    const q = Math.round(t * 30), am = t >= 4.2, f = am ? .72 + .18 * Math.sin(t * 17) : .08 + .7 * Math.pow(t / 4.2, 1.6);
    term.limpar(); K.carregando(term, .46 + .3 * P.clamp(t / 4.2), t); term.pixelar(); term.sinal(q, f);
    if (am) { term.amarelar(1, 1.45); if (t > 4.45) term.aviso('LOCAL DESCOBERTO', t); }                 // do nada: amarelo forte + aviso
    flash.style.cssText += ''; flash.style.background = '#fff2a8'; flash.style.opacity = q >= 126 && q < 128 ? 1 : 0; preto.style.opacity = 0;
  });
};
</script></body></html>
