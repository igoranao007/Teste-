<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Teste do personagem IGOR ANÃO (aprovação antes dos planos): sala preta, mesa de feltro verde, copo e celular. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:6}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const q = new URLSearchParams(location.search), vista = q.get('v') || 'medio';
  const CAMS = { medio: [[0, 1.0, 1.75], [0, 1.02, 0], 36], mao: [[.1, 1.05, .9], [.05, .78, .2], 34], perto: [[.12, 1.12, 1.05], [0, 1.06, 0], 34], lado: [[1.5, 1.15, 1.3], [0, .95, 0], 34], costas: [[-.5, 1.35, -1.3], [0, .95, .4], 40] };
  const [cam, alvo, fov] = CAMS[vista];
  const S = P.palco({ fov, cam, alvo, fundo: '#020604', nevoa: { cor: T.SOMBRA, perto: 2.2, longe: 7 },
    luz: { keyDir: [-.35, .8, .55], keyCor: '#e6efe2', fillDir: [.8, .1, .3], fillCor: '#1d5f37', amb: '#243a2b' } });
  const I = await T.igor(); S.scene.add(I.obj);
  I.obj.position.set(0, -.36, 0);
  I.corpo.sentar();
  I.corpo.braco('R', [-.3, -.88, .38], [.86, -.22, .46], [.95, -.06, .3], -1.5);     // braço direito dele (esquerda da tela) apoiado na mesa
  I.corpo.braco('L', [.3, -.85, .3], [-.25, -.55, .8], [-.4, -.2, .9]);
  if (q.get('rol')) I.corpo.girar('hand.R', +q.get('rol'));
  I.assentar();
  const hw = new THREE.Vector3(); I.corpo.osso('hand.R').getWorldPosition(hw); window.hw = hw;
  const Y = hw.y - .035;
  const mesa = T.mesaFeltro({ y: Y, d: .9 }); mesa.position.z = .5; S.scene.add(mesa);
  const copo = T.copoAgua(); copo.position.set(.6, Y, .6); S.scene.add(copo);
  const cel = T.celular(); cel.position.set(.3, Y, .55); cel.rotation.y = -.9; S.scene.add(cel);
  window.I = I; window.S = S;
  S.update = t => { I.animar(t, { boca: t > 2 && t < 4 ? Math.abs(Math.sin(t * 9)) : 0, pisca: (t % 3) > 2.85 ? 1 : 0 }); };
};
</script></body></html>
