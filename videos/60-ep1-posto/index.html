  const S = F.noite({ fov: 42, perto: 14, longe: 70, luz: { keyDir: [.2, .9, .4], keyCor: '#b9d8c2', amb: '#2c4232', fillCor: '#1c5a30' } });

    else if (t < 9.6) { anda = V.caminhar(Fr, [1.05, -3.45], JANELA, t, 5, 7, { de: -1.2 }); if (!anda) { Fr.obj.rotation.y = angLerp(Fr.obj.rotation.y, 0, P.suave(7, 7.4, t)); Fr.pose('idle', t); } }
    else if (t < 13.9) { anda = V.caminhar(Fr, JANELA, PB, t, 9.6, 11.9, { de: 0 }); if (!anda) { Fr.obj.rotation.y = angLerp(Math.atan2(PB[0] - JANELA[0], PB[1] - JANELA[1]), ROT_BOMBA, P.suave(11.9, 12.35, t)); if (t > 13.35) Fr.obj.rotation.y = angLerp(ROT_BOMBA, ROT_CARRO, P.suave(13.35, 13.9, t)); Fr.pose('idle', t); } }
    else if (t < 19.0) { anda = V.caminhar(Fr, PB, TAMPA, t, 13.9, 14.5, { de: ROT_CARRO }); if (!anda) { Fr.obj.rotation.y = angLerp(Math.atan2(TAMPA[0] - PB[0], TAMPA[1] - PB[1]), ROT_CARRO, P.suave(14.5, 14.85, t)); Fr.pose('idle', t * .6); } }
    else if (t < 20.85) { anda = V.caminhar(Fr, TAMPA, PB, t, 19.25, 20.05, { de: ROT_CARRO - .9 }); if (!anda) { const rTP = Math.atan2(PB[0] - TAMPA[0], PB[1] - TAMPA[1]);   /* vira ~50° parado depois de fechar a portinhola, e anda */

    else if (t < 24.4) { anda = V.caminhar(Fr, PB, JANELA, t, 20.85, 23.0, { de: ROT_BOMBA - .8 }); if (!anda) { Fr.obj.rotation.y = angLerp(Math.atan2(JANELA[0] - PB[0], JANELA[1] - PB[1]), 0, P.suave(23.0, 23.3, t)); Fr.pose('idle', t); } }

    else if (t < 31.2) { anda = V.caminhar(Fr, FORA, DENTRO, t, 29.1, 30.2, { de: Math.PI }); if (!anda) { Fr.obj.rotation.y = Math.PI; Fr.pose('idle', t); } }

    else { Fr.obj.position.set(MESA[0], 0, MESA[1]); Fr.obj.rotation.y = angLerp(Math.atan2(MESA[0] - DENTRO[0], MESA[1] - DENTRO[1]), .1, P.suave(33.3, 33.7, t)); const k = (t - 33.3); Fr.pose(k < Fr.dur('u_Sitting_Enter') ? 'u_Sitting_Enter' : 'u_Sitting_Idle_Loop', k < Fr.dur('u_Sitting_Enter') ? k : k - Fr.dur('u_Sitting_Enter')); }
    Fr.obj.updateMatrixWorld(true);
    const curva = P.suave(14.5, 15.0, t) * (1 - P.suave(18.6, 19.0, t));                       // inclina o tronco pra alcançar a traseira
    if (curva > 0) { V.girar(Fr, 'spine.002', [1, 0, 0], .28 * curva); V.girar(Fr, 'spine.003', [1, 0, 0], .14 * curva); Fr.obj.updateMatrixWorld(true); }
    // bico
    let B;
    if (t < 13.15) B = noSuporte();
    else if (t < 13.4) B = noSuporte(P.suave(13.15, 13.4, t));
    else if (t < 13.95) B = mix(noSuporte(1), carregado(), P.suave(13.4, 13.95, t));
    else if (t < 14.85) B = carregado();
    else if (t < 15.15) B = mix(carregado(), noTanque(t, 0), P.suave(14.85, 15.15, t));
    else if (t < 18.3) B = noTanque(t, P.suave(15.15, 15.35, t));
    else if (t < 18.45) B = noTanque(t, 1 - P.suave(18.3, 18.45, t));
    else if (t < 18.75) B = mix(noTanque(t, 0), carregado(), P.suave(18.45, 18.75, t));
    else if (t < 20.2) B = carregado();
    else if (t < 20.45) B = mix(carregado(), noSuporte(1), P.suave(20.2, 20.45, t));

    if (arco > 0) { const sp = Fr.osso('spine').getWorldPosition(v3()), dv = B.p.clone().sub(sp); dv.y = 0;          // o caminho do bico passa por fora da barriga

    bico.position.copy(B.p); bico.quaternion.copy(B.q); bico.updateMatrixWorld(true); bico.obstaculos = [() => V.capsulasCorpo(Fr)]; bico.mangueira();   // a mangueira contorna o frentista

    const pegaBico = P.suave(12.6, 13.15, t) * (1 - P.suave(20.6, 20.85, t));
    if (pegaBico > 0) { const r = Fr.obj.rotation.y, U = v3(0, 0, 1).applyQuaternion(bico.quaternion), F = v3(0, 1, 0).applyQuaternion(bico.quaternion);

      // em uso: palma por cima, dedos descendo pela frente do cabo até o gatilho (pulso quase reto)
      const uso = P.suave(13.4, 13.95, t) * (1 - P.suave(20.2, 20.5, t));
      const alvoG = bico.localToWorld(GRIP.clone()), hor = alvoG.clone().sub(Fr.obj.position); hor.y = 0; hor.normalize();
      const dedosGancho = hor, dedosUso = U.clone().negate().multiplyScalar(.8).addScaledVector(F, .45).addScaledVector(direita(r), -.2);
      // pegada definida NO GANCHO (bico em pé = rotação identidade): dedos na direção do braço até o cabo, indicador pra cima;
      // depois a mão gira junto com o bico (pegada rígida) — ao deitar o bico, a palma fica por cima e os dedos descem pro gatilho

    // mão esquerda: abre e fecha a portinhola

    if (maca > 0 && t < 29.5) { const r = Fr.obj.rotation.y; V.pegar(Fr, 'R', AL.macaneta(), frente(r).add(v3(0, -.3, 0)).normalize(), v3(0, 1, 0), direita(r).multiplyScalar(.8).add(v3(0, -.6, 0)), maca, .8); }
    // pedra: sai da mão do Metalis no escuro (30,55) → bate no teto (31,15) → quica e cai no chão (31,7)

      else if (t < 31.7) { const u = (t - 31.15) / .55; p = b.clone().lerp(c, u); p.y = P.lerp(b.y, c.y, u * u) + Math.sin(Math.PI * u) * .35; }
      else p = c; pedra.position.copy(p); pedra.rotation.set(t * 9, t * 7, 0); }

      AdF.obj.updateMatrixWorld(true);
      const cab = (t < 34.1 ? P.suave(33.3, 33.7, t) : 1 - P.suave(34.1, 34.5, t)) * -.45 + P.suave(34.9, 35.3, t) * (1 - P.suave(35.6, 35.9, t)) * -.35;   // olha o teto do carro (e a pedra no chão)

    // câmeras (nas tomadas pela janela, mais luz dentro do carro)
    const janela = (t >= 15.4 && t < 17.4) || (t >= 18.6 && t < 20.0) || (t >= 20.9 && t < 24.4);
    P.luz({ keyDir: [.2, .9, .4], keyCor: '#b9d8c2', amb: janela ? '#5f8068' : '#2c4232', fillDir: [-.1, .2, -1], fillCor: janela ? '#6fae82' : '#1c5a30' });
    if (camQ) cam(camQ.slice(0, 3), camQ.slice(3, 6), camQ[6]);
    else if (t < 5) cam([14, 6, 13], [P.lerp(-10, 0, ch), .8, P.lerp(7, -1, ch)], 40);
    else if (t < 10.9) cam([1.35, 1.72, -3.55], [.2, 1.0, -.35], 36);                                          // por cima do ombro do frentista
    else if (t < 14.3) cam([-1.15, 1.55, -1.25], [-2.75, .95, -2.45], 46);                                     // estende o braço e tira o bico do gancho
    else if (t < 15.4) cam([-1.05, 1.2, -1.85], [-1.85, .86, -.98], 42);                                     // abre a portinhola e encaixa o bico
