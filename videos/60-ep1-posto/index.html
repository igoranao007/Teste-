    else if (t < 18.6) cam([-3.3, 1.5, -.15], [-2.05, 1.25, -1.4], 40);                                      // frentista calado, abastecendo
    else if (t < 20.0) cam([.15, 1.12, -1.55], [.28, 1.04, -.3], 40);                                        // "beleza... também não precisa conversar"
