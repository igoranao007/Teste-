<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- PLANO 2 · 0:08–0:20 · DENTRO DO CARRO: (0–4) plano médio do banco do passageiro · (4–7) close da maleta, ele olha de canto · (7–12) close no rosto, boca sem som. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:12}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 46, perto: 3, longe: 22 }), cena = S.scene, R = P.rng(8);
  const car = F.interiorCarro(); cena.add(car);
  // lá fora: árvores e postes passando (o carro fica parado, o mundo anda pra trás)
  const fora = []; for (let i = 0; i < 16; i++) { const a = F.arvore(R, { h: 5 }); a.userData = { x: (i % 2 ? 1 : -1) * (4 + R() * 7), z0: i * 5.5 + R() * 3 }; cena.add(a); fora.push(a); }
  const faixas = [0, 1, 2].map(i => { const f = P.caixa(.12, 4.5, .12, P.mat({ cor: '#1a1a12', semLuz: true })); const hl = P.disco(.5, P.mat({ mapa: F.TEX.brilho(), cor: F.AMARELO, opac: .7, aditivo: true, semLuz: true, lados: THREE.DoubleSide }), { pos: [.3, 2.2, 0], rot: [0, Math.PI / 2, 0] }); f.add(hl); f.userData = { z0: i * 30 + 6 }; cena.add(f); return f; });
  const chao = P.caixa(60, .05, 120, P.mat({ mapa: F.TEX.terra(), rep: [20, 40], cor: '#3a4a3c' }), { pos: [0, -.35, 20], sx: 6, sz: 12 }); cena.add(chao);

  const Ph = await T.phantom(); cena.add(Ph.obj); Ph.obj.position.set(-.4, -.4, -.12);
  const c = Ph.corpo; c.sentar();
  c.braco('L', [.14, -.8, .6], [-.25, -.02, 1]); c.braco('R', [-.14, -.8, .6], [.25, -.02, 1]);
  { const a = new THREE.Vector3(), b = new THREE.Vector3(); c.osso('f_middle.01.L').getWorldPosition(a); c.osso('f_middle.01.R').getWorldPosition(b); car.volante.position.copy(a.add(b).multiplyScalar(.5)).add(new THREE.Vector3(0, -.02, .05)); }
  c.guardar();
  const mal = T.maleta(); mal.position.set(.4, .47, .02); mal.rotation.set(-.12, .25, 0); cena.add(mal);

  const CAM = [
    { a: 0, pos: [.7, 1.12, .34], alvo: [-.4, 1.02, .12], fov: 46, pont: .5 },
    { a: 4, pos: [.74, .95, .52], alvo: [.1, .8, -.1], fov: 52, pont: .5 },
    { a: 7, pos: [-.36, 1.2, .5], alvo: [-.4, 1.19, -.1], fov: 30, pont: .6 },
  ];
  S.update = t => {
    const k = [...CAM].reverse().find(q => t >= q.a), tl = t - k.a;
    S.camera.fov = k.fov; S.camera.updateProjectionMatrix();
    S.camera.position.set(k.pos[0] + Math.sin(t * 7.3) * .004, k.pos[1] + Math.sin(t * 11) * .005, k.pos[2] + (k.a === 7 ? -tl * .012 : 0)); S.camera.lookAt(...k.alvo);
    const v = 15;                                                   // m/s
    for (const a of fora) a.position.set(a.userData.x, -.35, 44 - ((a.userData.z0 + t * v) % 88));
    let amar = 0; for (const f of faixas) { const z = 50 - ((f.userData.z0 + t * v) % 90); f.position.set(-4.2, 1.6, z); amar = Math.max(amar, Math.exp(-(((z - .3) / 2.2) ** 2))); }
    // a luz amarela do poste varre o rosto quando ele passa
    const mix = (a, b) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), amar).getHexString();
    P.luz({ keyDir: [-.9, .35, .3 - amar * .2], keyCor: mix('#9cc4a8', '#ffd070'), fillDir: [.2, -.3, .9], fillCor: '#2a8a48', amb: mix('#1c3324', '#3a3216') });
    c.repor();
    const bal = Math.sin(t * 5.1) * .012 + Math.sin(t * 8.7) * .006;                      // a estrada balança a cabeça
    c.virar('head', [0, 0, 1], bal); c.virar('head', [1, 0, 0], Math.sin(t * 3.3) * .01);
    const olha = k.a === 4 ? P.suave(1.0, 1.25, tl) * (1 - P.suave(1.7, 2.0, tl)) : 0;    // olhada de canto pra maleta
    c.virar('head', [0, 1, 0], olha * .7); c.virar('neck', [0, 1, 0], olha * .25);
    const ciclo = (t + .6) % 3.4, pisca = k.a === 7 ? P.suave(0, .35, ciclo) * (1 - P.suave(.5, .95, ciclo)) : (ciclo < .2 ? 1 : 0);
    const fala = k.a === 7 && tl > 1.2 && tl < 4.4 ? Math.max(0, Math.sin((tl - 1.2) * 4.1)) * (.6 + .4 * Math.sin(tl * 9)) : 0;   // tenta falar, sem som
    Ph.animar(t, { pisca, boca: fala, pont: k.pont + .05 * Math.sin(t * 2.1) });
    mal.pulsar(t);
  };
  cue('lamp_click', 4);   // marca só pra conferência; o áudio final sai do roteiro de som (tools/som.mjs)
};
</script></body></html>
