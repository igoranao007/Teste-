<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- PLANO 2 · DENTRO DO CARRO: (0–4) plano médio do banco do passageiro · (4–7) close da maleta, ele olha de canto · (7–12) close no rosto, boca sem som. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:12}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 46, perto: 3, longe: 22 }), cena = S.scene;
  const car = await F.interiorCarro(); cena.add(car);
  const Ph = await T.phantom({ esc: .84 }); cena.add(Ph.obj); Ph.obj.position.set(.35, -.2, .2);
  const c = Ph.corpo; c.sentar(); const V = car.volante;
  c.alcancar('L', [V.x + .13, V.y + .05, V.z - .03], [.5, -.8, -.2], .1); c.alcancar('R', [V.x - .13, V.y + .05, V.z - .03], [-.5, -.8, -.2], .1);
  c.guardar();
  const mal = T.maleta(); mal.position.set(-.36, .665, .34); mal.rotation.set(-.14, -.3, 0); cena.add(mal);
  window.Ph = Ph; window.S = S;
  const CAM = [
    { a: 0, pos: [-.5, 1.3, 1.75], alvo: [.22, 1.05, .2], fov: 36, pont: .55 },
    { a: 4, pos: [-1.25, 1.18, .62], alvo: [-.3, .86, .3], fov: 40, pont: .52 },
    { a: 7, pos: [.29, 1.2, .47], alvo: [.35, 1.235, .2], fov: 60, pont: .62 },
  ];
  const POSTES = [1.2, 3.4, 6.1, 8.3, 10.6];                         // instantes em que um poste de luz amarela passa
  S.update = t => {
    const k = [...CAM].reverse().find(q => t >= q.a), tl = t - k.a;
    S.camera.fov = k.fov; S.camera.updateProjectionMatrix();
    S.camera.position.set(k.pos[0] + Math.sin(t * 7.3) * .003, k.pos[1] + Math.sin(t * 11) * .004, k.pos[2]); S.camera.lookAt(...k.alvo);
    let amar = 0, lado = 0; for (const q of POSTES) { const d = (t - q) / .32; if (Math.abs(d) < 2) { const e = Math.exp(-d * d); if (e > amar) { amar = e; lado = d; } } }
    // a faixa de luz amarela do poste varre o rosto de frente pra trás
    const mix = (a, b) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), amar).getHexString();
    P.luz({ keyDir: [.9, .35, .5 - lado * .6], keyCor: mix('#b8dcc2', '#ffcf66'), fillDir: [-.2, -.3, .9], fillCor: '#2f9a50', amb: mix('#35503d', '#5a4c22') });
    c.repor();
    const bal = Math.sin(t * 5.1) * .012 + Math.sin(t * 8.7) * .006;                      // a estrada balança a cabeça
    c.virar('head', [0, 0, 1], bal); c.virar('head', [1, 0, 0], Math.sin(t * 3.3) * .012); c.virar('spine.003', [0, 0, 1], bal * .5);
    const olha = k.a === 7 ? P.suave(.3, .55, tl) * (1 - P.suave(1.0, 1.3, tl)) : 0;    // olhada de canto pra maleta
    c.virar('head', [0, 1, 0], -olha * .75); c.virar('neck', [0, 1, 0], -olha * .25);
    const ciclo = (t + .6) % 3.4, pisca = k.a === 7 ? P.suave(0, .35, ciclo) * (1 - P.suave(.5, .95, ciclo)) : (ciclo < .2 ? 1 : 0);
    const fala = k.a === 7 && tl > 1.8 && tl < 4.6 ? Math.max(0, Math.sin((tl - 1.8) * 4.1)) * (.6 + .4 * Math.sin(tl * 9)) : 0;   // tenta falar, sem som
    Ph.animar(t, { pisca, boca: fala, pont: k.pont + .05 * Math.sin(t * 2.1) });
    mal.pulsar(t);
  };
};
</script></body></html>
