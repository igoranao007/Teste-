<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 11 · A SALA DO IGOR (14 s): sala escura; Igor diante do computador antigo, a tela ilumina o rosto de verde; ele assiste a um vídeo.
     No fundo, o quadro do aniversário; na mesa, o retrato. Aproximação lenta; "Nem mesmo no meu aniversário eles conseguem se segurar...";
     a câmera gira em volta dele; a tela aparece em alguns momentos; no fim ele percebe que alguém chegou. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:14}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({ fov: 40, cam: [0, 1, 1.75], alvo: [0, 1.02, 0], fundo: '#020604', nevoa: { cor: F.SOMBRA, perto: 3, longe: 12 }, luz: F.LUZ_SALA }), cena = S.scene;
  const sala = await V.salaIgor4(cena), { I, Y, lamp, pc, est, rot, ANG } = sala, fala = await V.vozes();
  I.girar(1);
  const tela = () => pc.localToWorld(new THREE.Vector3(0, .28, -.18));
  S.update = t => {
    sala.video(t); lamp.acender(.35, S.camera); est.visible = true;
    const brilho = .75 + .25 * Math.sin(t * 23) * Math.sin(t * 7);
    P.luz({ ...F.LUZ_SALA, keyDir: rot(0, .1, 1), keyCor: '#' + new THREE.Color('#5fd88a').multiplyScalar(brilho).getHexString(), fillDir: rot(-.6, .6, -.4), fillCor: '#16321f', amb: '#141f18' });
    // mãos no teclado, digita de vez em quando; cabeça vira um pouco quando percebe alguém (12,4)
    const tk = s => Math.max(0, Math.sin(t * 19 + s)) * .016 * (t > .5 && t < 6.5 ? 1 : 0);
    const m = { R: rot(-.1, Y + .075 + tk(0), .2), L: rot(.1, Y + .075 + tk(2), .2), poloR: rot(-.9, -.3, -.2), poloL: rot(.9, -.3, -.2), plana: true, extra: .04 };
    const v = fala('51', t, 'igor'); I.pose(t, m); I.animar(t, { boca: v, pisca: (t % 4.1) > 3.95 ? 1 : 0 });
    I.cabeca.rotation.x += .1; I.cabeca.rotation.y += -.5 * P.suave(12.2, 12.9, t);
    // câmera: aproximação lenta pelas costas (vê a tela), depois gira em volta até o rosto
    const T0 = tela();
    if (t < 6.5) { const u = P.suave(0, 6.5, t); S.camera.fov = P.lerp(44, 36, u); S.camera.position.set(...rot(P.lerp(-1.4, -.5, u), P.lerp(1.75, 1.5, u), P.lerp(-1.1, -.55, u))); S.camera.lookAt(T0.x, T0.y - .05, T0.z); }
    else { const a = P.lerp(-2.1, -.75, P.suave(6.5, 14, t)), R = 1.3, c = rot(0, 0, .25);
      S.camera.fov = 38; S.camera.position.set(c[0] + Math.sin(a + ANG) * R, 1.42, c[2] + Math.cos(a + ANG) * R); S.camera.lookAt(...rot(0, 1.2, .1)); }
    S.camera.updateProjectionMatrix();
  };
};
</script></body></html>
