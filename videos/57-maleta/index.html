<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v5 · ANTES DE CASMIRON (14 s): primeira pessoa do Adryan dirigindo de noite. Olha pro Nicolas: a maleta está ABERTA no colo dele,
     brilhando verde. "O que eu disse, caralho? Que não era pra abrir a maleta!" · Nicolas (sem voz, só legenda): "Como assim? Não abri nada, pô."
     · volta pra estrada: "Não sei por que o Igor deu a confiança em você." · a placa de Casmiron City aparece aos poucos na neblina. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:14}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 62, perto: 12, longe: 95, luz: { keyDir: [.2, .8, .6], keyCor: '#a8cdb2', amb: '#1a2e20', fillCor: '#1c5a30' } }), cena = S.scene, R = P.rng(61);
  // a mesma estrada do plano 46 (asfalto, mato, árvores, postes, a placa e a cidade ao fundo)
  cena.add(A.chaoA({ w: 300, d: 260, seg: 90, mapa: F.TEX.capim(), rep: [90, 80], y: -.03 }));
  await V.asfalto(cena, -150, 150, 0);
  await V.arvoresRetro(cena, R, { x0: -150, x1: 120, z0: 9, z1: 50, n: 46 });
  await V.arvoresRetro(cena, R, { x0: -150, x1: 20, z0: -9, z1: -50, n: 30 });
  const cid = F.cidade(R, { n: 30 }); cid.position.set(60, 0, -110); cena.add(cid);
  const postes = [-110, -80, -50, -14].map(x => F.posteVerde(x, -7, { rot: Math.PI / 2 })); postes.forEach(p => cena.add(p));
  const placa = F.placaCidade(); placa.position.x = 0; cena.add(placa);
  A.assar(cena, postes.map(p => p.luz()), '#1b3524');
  // o carro por dentro, com a dupla; anda no +x pela faixa (mesma direção do plano 46)
  const gc = new THREE.Group(); gc.rotation.y = Math.PI / 2; cena.add(gc);
  const D = await V.carroComDupla(gc), fala = await V.vozes(), v3 = (x, y, z) => new THREE.Vector3(x, y, z);
  for (const ml of D.Ad.malhas) if (/head/i.test(ml.name)) ml.visible = false;                       // primeira pessoa: a cabeça do Adryan é a câmera
  const X0 = -122, VEL = 8.4;
  S.update = t => {
    gc.position.set(X0 + VEL * t, .02, -1.6 + Math.sin(t * 7) * .004); gc.updateMatrixWorld(true);
    // luz: postes passando (amarelo) + o verde da maleta aberta no rosto do Nicolas
    let amar = 0; for (const p of postes) { const d = (p.position.x - gc.position.x) / 9; amar = Math.max(amar, Math.exp(-d * d)); }
    const mix = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString(), aberta = 1;
    P.luz({ keyDir: [-.9, .35, .5], keyCor: mix('#9fc7aa', '#ffcf66', amar), fillDir: [.4, -.6, .2], fillCor: mix('#1c5a30', '#39ff6a', .55 * aberta), amb: mix('#2c4434', '#5a4c22', amar * .6) });
    // Nicolas: olha a maleta (cabeça baixa) → olha pro Adryan quando ele grita → responde (sem voz) → volta pra maleta
    const olha = P.suave(4.6, 5.1, t) * (1 - P.suave(9.0, 9.6, t)), fNi = t > 6.3 && t < 8.6 ? Math.abs(Math.sin(t * 8.3)) * .7 + .2 : 0;
    D.atualizar(t, { giro: .06 * Math.sin(t * .5), falaAd: fala('57', t, 'adryan'), olhaNi: .95 * olha, acenaNi: .32 * (1 - olha) - .05 * olha });
    if (fNi > 0) V.falar(D.Ni, fNi, t);
    D.mal.abrir?.(1.25 * aberta); D.mal.brilho?.(.8 + .2 * Math.sin(t * 6));
    // câmera = cabeça do Adryan: estrada → vira pro Nicolas e a maleta → volta pra estrada (a placa vem chegando)
    const cab = D.Ad.osso('spine.005').getWorldPosition(v3(0, 0, 0)).add(v3(0, .06, 0));
    const frente = cab.clone().add(v3(12, -.6, .3)), alvoNi = D.Ni.osso('spine.003').getWorldPosition(v3(0, 0, 0)).lerp(D.mal.getWorldPosition(v3(0, 0, 0)), .45).lerp(D.Ni.osso('spine.005').getWorldPosition(v3(0, 0, 0)), .55 * olha);   /* quando ele responde, a câmera sobe pro rosto dele */
    const vira = P.suave(2.1, 2.9, t) * (1 - P.suave(8.8, 9.6, t)), alvo = frente.clone().lerp(alvoNi, vira);
    alvo.y += Math.sin(t * 1.3) * .015; S.camera.position.copy(cab); S.camera.lookAt(alvo); S.camera.fov = P.lerp(62, 54, vira); S.camera.updateProjectionMatrix();
    for (const p of postes) p.halo.quaternion.copy(S.camera.quaternion).premultiply(p.getWorldQuaternion(new THREE.Quaternion()).invert());
  };
};
</script></body></html>
