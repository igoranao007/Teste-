    // ═══ CÂMERA = olhos do Adryan ═══
    if (camQ) { S.camera.fov = camQ[6]; S.camera.position.set(...camQ.slice(0, 3)); S.camera.lookAt(...camQ.slice(3, 6)); S.camera.up.set(0, 1, 0); S.camera.updateProjectionMatrix(); return; }
    if (t < T_KAT) { Ad.obj.visible = true; S.camera.up.set(0, 1, 0);
      const fov = t < 11.8 ? 48 : t < 18 ? 50 : t < 21 ? 60 : t < 22.6 ? 54 : 50;
      B.pov(t, olharPara, { fov }); E0 = null; return; }
    // ── ESQUIVA EM 3 TEMPOS: susto (tranco pra trás) → cedência (joelhos, o olhar cai) → impacto (chão); a câmera é o corpo caindo
    Ad.obj.visible = false;
    if (!E0) { Ad.obj.visible = true; Ad.obj.position.set(AD_VOLANTE[0], 0, AD_VOLANTE[1]); Ad.obj.rotation.y = ang(AD_VOLANTE[0], AD_VOLANTE[1], PORTA_C.x, PORTA_C.z); Ad.pose('idle', T_KAT + 30); E0 = B.olho(); Ad.obj.visible = false; }
    const LAM = FURO.clone().add(v3(0, -.02, -.28)), K1 = E0.clone().add(v3(.02, .02, -.15)), K2 = v3(-.3, .95, 2.55), K3 = v3(-.12, .3, 2.2);
    const s1 = P.suave(T_KAT, T_KAT + .22, t), s2 = P.suave(T_KAT + .24, 25.15, t), s3 = P.clamp((t - 25.15) / .2);
    const pos = E0.clone().lerp(K1, s1).lerp(K2, s2 * s2).lerp(K3, s3 * s3);
    const impacto = t > T_CAI ? Math.exp(-(t - T_CAI) * 9) * Math.sin((t - T_CAI) * 60) : 0, resp = t > T_CAI ? Math.sin((t - T_CAI) * 2 * Math.PI * 1.55) * (1 - .3 * P.suave(T_CAI, 30, t)) : 0;
    pos.y += .03 * impacto + .012 * resp;
    const alvo = LAM.clone().lerp(v3(-.55, .25, 2.95), .55 * env(t, T_KAT + .3, 24.85, 25.25, 25.9));   // na cedência o olhar despenca pro chão e volta pra lâmina
    alvo.y += .02 * resp; alvo.x += .01 * Math.sin(t * .9) * P.suave(26, 27, t);
    const roll = .22 * s2 * (1 - .4 * s3) + .02 * impacto;                                            // o corpo deitado de lado: o horizonte inclina
    S.camera.position.copy(pos); S.camera.up.set(Math.sin(roll), Math.cos(roll), 0); S.camera.lookAt(alvo);
    S.camera.fov = 50 + 8 * s1 * (1 - s3) + 6 * s3; S.camera.updateProjectionMatrix();
  };
};
