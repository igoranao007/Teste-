<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EPISÓDIO 1 (reformulado) · CENA 68 · A PORTA-BUNKER (continua a 67; a sirene vermelha ainda toca). POV do ADRYAN: o Igor, de pé,
     se arruma e aponta a porta: "Fecha essa porta imediatamente!" · Adryan: "Mas é o Nicolas, ele tá só!" · Igor: "Ele vai ficar bem.
     O Nicolas conhece os procedimentos de sobrevivência." · o Adryan não aceita e vai pra porta; o GUSTA segura ele pelos ombros:
     "Ele vai ficar bem. Mas se ficar na rebeldia, iremos morrer." · os dois FECHAM a porta-bunker juntos e TRANCAM (volante e trincos)
     · ao mesmo tempo o Igor aperta o BOTÃO VERMELHO: alerta, e a estante desliza: a SALA SECRETA, tomada pela luz verde das telas.
     Corte sincronizado pra Kessinburgh (cena 69). ?cam=x,y,z,ax,ay,az,fov (inspeção) -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:23}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as T from '../../lib/tgp.js';
import * as E4 from '../../lib/elenco4.js';
import * as E from '../../lib/ep1.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = P.palco({ fov: 40, cam: [0, 1.5, 3], alvo: [0, 1.0, 0], fundo: '#020604', nevoa: { cor: F.SOMBRA, perto: 4, longe: 14 }, luz: F.LUZ_SALA }), cena = S.scene;
  S.camera.near = .03;
  const sala = await V.salaIgor4(cena), { I, Y, pc, rot, ANG, cadeira } = sala, fala = await V.vozes('ep1');
  await E.computadorNovo(sala);
  const q0 = new URLSearchParams(location.search), camQ = q0.get('cam')?.split(',').map(Number);
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z), env = (t, a, b, c, d) => P.suave(a, b, t) * (1 - P.suave(c, d, t));
  const frente = r => v3(Math.sin(r), 0, Math.cos(r)), direita = r => v3(-Math.cos(r), 0, Math.sin(r));
  const cam = (p, a, fov) => { S.camera.fov = fov; S.camera.position.set(...p); S.camera.lookAt(...a); S.camera.updateProjectionMatrix(); };
  const angLerp = (a, b, u) => { let d = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; return a + d * u; };
  // a cadeira continua caída (cena 67) e o Igor sentado some: agora ele está de pé
  I.girar(1); const f0 = frente(ANG), d0 = direita(ANG); const tomba = new THREE.Group(); tomba.position.copy(f0.clone().multiplyScalar(-.32)); cena.add(tomba);
  cena.updateMatrixWorld(true); tomba.attach(cadeira); tomba.quaternion.setFromAxisAngle(d0, 1.42); I.obj.visible = false;
  const Ig = await T.igor({ anim: true }); cena.add(Ig.obj);
  const Ad = await E4.ator('adryan'), Gu = await E4.ator('gusta'); cena.add(Ad.obj, Gu.obj); T.poses(Ad.modelo); T.poses(Gu.modelo);
  const porta = E.portaBunker(cena, { x: -.7, z: 3.6 });
  const botao = E.botaoVermelho(); botao.position.set(-.48, Y, .2); botao.rotation.y = .4; cena.add(botao);
  const itens = cena.children.filter(o => o.position.x > .8 && o.position.x < 2.4 && Math.abs(o.position.z + 1.43) < .03);
  const secreta = E.salaSecreta(cena, itens);
  // posições
  const IG = [-1.0, .15], R_IG = .35, AD0 = [-.12, 1.32], GU0 = [-.95, 1.62];
  const AD_PORTA = [-.5, 2.55], GU_ATRAS = [-.62, 2.05], AD_FECHA = [-.55, 3.05], GU_FECHA = [-1.0, 2.95];
  // alarme no monitor (continua da cena 67): vermelho + ALERTA
  const monitor = t => { const x = pc.ctx, W = pc.cv.width, H = pc.cv.height, on = Math.floor(t * 3) % 2 === 0; x.fillStyle = on ? '#5a0804' : '#120201'; x.fillRect(0, 0, W, H);
    if (on) { x.fillStyle = '#ff2a12'; x.fillRect(W * .1, H * .38, W * .8, H * .24); x.fillStyle = '#1a0200'; x.font = `bold ${Math.floor(H * .14)}px monospace`; x.textAlign = 'center'; x.fillText('ALERTA', W / 2, H * .55); }
    pc.tex.needsUpdate = true; };
  S.update = t => {
    monitor(t);
    const vI = fala('68', t, 'igor'), vA = fala('68', t, 'adryan'), vG = fala('68', t, 'gusta');
    // ── IGOR (de pé): se arruma (0–.6), APONTA a porta gritando (0,6–3,0), fala com o Adryan (5,3–9,4), vai até o botão (16,6–17,4) e APERTA (17,6)
    Ig.obj.position.set(IG[0], 0, IG[1]); Ig.obj.rotation.y = R_IG + .25 * P.suave(16.6, 17.2, t);
    Ig.corpo.clip('u_Idle_Loop', t); Ig.obj.updateMatrixWorld(true);
    const aponta = env(t, .55, .9, 2.8, 3.3), aperta = env(t, 16.9, 17.5, 18.4, 18.9), puxa = env(t, -1, 0, .3, .6);
    if (aponta > 0) { const o = Ig.corpo.osso('upper_arm.R').getWorldPosition(v3()), alvo = o.clone().add(porta.dentro(0).sub(o).setY(0).normalize().multiplyScalar(.55)).add(v3(0, .12, 0));
      Ig.corpo.alcancar('R', alvo.toArray(), [-.5, -.8, .2], .02); }
    if (puxa > 0) Ig.corpo.alcancar('L', Ig.obj.position.clone().add(v3(0, 1.0, 0)).addScaledVector(frente(R_IG), .18).toArray(), [.6, -.6, 0], .02);   // ajeita o moletom
    if (aperta > 0) { botao.updateMatrixWorld(true); const b = botao.topo().add(v3(0, .03 * (1 - P.suave(17.45, 17.6, t)) - .015 * env(t, 17.55, 17.62, 17.8, 18.0), 0)); Ig.corpo.alcancar('R', b.toArray(), [-.6, -.7, -.2], .02); }
    botao.apertar(env(t, 17.55, 17.62, 17.8, 18.0));
    Ig.assentar(); Ig.animar(t, { boca: vI, pisca: (t % 3.4) > 3.25 ? 1 : 0 });
    // ── ADRYAN: escuta (0–2,8), protesta (2,9), escuta, NÃO aceita e vai pra porta (9,6–10,9), o Gusta segura; vira pro Gusta (11,6–12,2),
    //    vão juntos fechar (15,0–17,5): mãos na folha; depois gira o volante (17,9–19,3); vira pra sala secreta (20,2–21,0)
    let rA;
    if (t < 9.6) { Ad.obj.position.set(AD0[0], 0, AD0[1]); rA = Math.atan2(IG[0] - AD0[0], IG[1] - AD0[1]); Ad.obj.rotation.y = rA; Ad.pose('idle', t, 'talk', .5 * fala.peso('68', t, 'adryan'), t); }
    else if (t < 15.0) { const anda = V.caminhar(Ad, AD0, AD_PORTA, t, 9.6, 10.9, { de: Math.atan2(IG[0] - AD0[0], IG[1] - AD0[1]) });
      if (!anda) { Ad.obj.rotation.y = angLerp(Math.atan2(AD_PORTA[0] - AD0[0], AD_PORTA[1] - AD0[1]), Math.atan2(GU_ATRAS[0] - AD_PORTA[0], GU_ATRAS[1] - AD_PORTA[1]), P.suave(11.6, 12.3, t)); Ad.pose('idle', t); } }
    else if (t < 20.2) { if (!V.caminhar(Ad, AD_PORTA, AD_FECHA, t, 15.0, 16.0, { de: Math.atan2(GU_ATRAS[0] - AD_PORTA[0], GU_ATRAS[1] - AD_PORTA[1]) })) { Ad.obj.rotation.y = 0; Ad.pose('idle', t); } }
    else { Ad.obj.position.set(AD_FECHA[0], 0, AD_FECHA[1]); Ad.obj.rotation.y = angLerp(0, Math.atan2(1.42 - AD_FECHA[0], -1.7 - AD_FECHA[1]), P.suave(20.2, 21.0, t)); Ad.pose('idle', t); }
    Ad.obj.updateMatrixWorld(true);
    // ── GUSTA: vem por trás (9,9–10,7) e segura o Adryan PELOS OMBROS (10,6–14,9), fala; vão fechar (15,0–16,0): empurra a folha; vira pra sala secreta
    let rG;
    if (t < 9.9) { Gu.obj.position.set(GU0[0], 0, GU0[1]); Gu.obj.rotation.y = Math.atan2(IG[0] - GU0[0], IG[1] - GU0[1]) + .2; Gu.pose('idle', t + .7); }
    else if (t < 15.0) { if (!V.caminhar(Gu, GU0, GU_ATRAS, t, 9.9, 10.7, { de: Math.atan2(IG[0] - GU0[0], IG[1] - GU0[1]) + .2 })) {
        Gu.obj.rotation.y = Math.atan2(AD_PORTA[0] - GU_ATRAS[0], AD_PORTA[1] - GU_ATRAS[1]); Gu.pose('idle', t, 'talk', .4 * fala.peso('68', t, 'gusta'), t); } }
    else if (t < 20.2) { if (!V.caminhar(Gu, GU_ATRAS, GU_FECHA, t, 15.0, 16.0, { de: Math.atan2(AD_PORTA[0] - GU_ATRAS[0], AD_PORTA[1] - GU_ATRAS[1]) })) { Gu.obj.rotation.y = .2; Gu.pose('idle', t); } }
    else { Gu.obj.position.set(GU_FECHA[0], 0, GU_FECHA[1]); Gu.obj.rotation.y = angLerp(.2, Math.atan2(1.42 - GU_FECHA[0], -1.7 - GU_FECHA[1]), P.suave(20.4, 21.2, t)); Gu.pose('idle', t); }
    Gu.obj.updateMatrixWorld(true);
    // mãos do Gusta nos OMBROS do Adryan
    const segura = env(t, 10.5, 10.85, 14.6, 15.0);
    if (segura > 0) for (const s of ['L', 'R']) { const om = Ad.osso('upper_arm.' + s).getWorldPosition(v3()).add(v3(0, .05, 0)), rG2 = Gu.obj.rotation.y;
      V.pegar(Gu, s, om, frente(rG2).add(v3(0, -.5, 0)).normalize(), v3(0, 1, 0), direita(rG2).multiplyScalar(s === 'L' ? -1 : 1).add(v3(0, -.6, 0)), segura, .6); }
    // ── a PORTA: fecha (16,0–17,45, com peso) e TRANCA (17,9–19,3)
    const fecha = P.clamp((t - 16.0) / 1.45); porta.fechar(fecha * fecha * (3 - 2 * fecha)); porta.trancar(P.suave(17.9, 19.3, t));
    porta.grupo.updateMatrixWorld(true);
    const empurra = env(t, 15.7, 16.0, 17.5, 17.8), gira = env(t, 17.75, 17.95, 19.3, 19.6);
    if (empurra > 0) { const pz = porta.puxador(); V.pegar(Ad, 'R', pz, v3(0, 0, 1), v3(0, 1, 0), [.7, -.5, 0], empurra, .2); V.pegar(Gu, 'R', porta.folha.localToWorld(v3(-.1, .2, -.16)), v3(0, 0, 1), v3(0, 1, 0), [.7, -.5, 0], empurra, .2); }
    if (gira > 0) { const w = porta.volanteW(), a = porta.volante.rotation.z; for (const [s, ph] of [['R', 0], ['L', Math.PI]]) V.pegar(Ad, s, w.clone().add(v3(Math.cos(a + ph) * .2, Math.sin(a + ph) * .2, -.02)), v3(0, 0, 1), v3(0, 1, 0), [s === 'R' ? .7 : -.7, -.5, 0], gira, .9); }
    V.falarOsso && Ad.osso('spine.005') && V.falar(Ad, vA, t); V.falar(Gu, vG, t);
    // ── SALA SECRETA: a estante desliza (19,0–21,0) e a luz verde invade
    const abre = P.suave(19.0, 21.0, t), verde = P.suave(19.2, 21.5, t); secreta.abrir(abre); secreta.atualizar(t, verde);
    // luz: sirene vermelha (da cena 67) → o verde da sala secreta vence
    const pis = .5 + .5 * Math.sin(t * 9.4), red = new THREE.Color('#ff2a12').multiplyScalar(.3 + .8 * pis * (1 - verde * .7)), grn = new THREE.Color('#39ff6a').multiplyScalar(1.4 * verde);
    P.luz({ keyDir: [Math.sin(t * 4.7), .4, Math.cos(t * 4.7)], keyCor: '#' + red.getHexString(), fillDir: [-.4, .25, 1], fillCor: '#' + new THREE.Color('#2a0805').lerp(grn, verde).getHexString(), amb: '#' + new THREE.Color('#3e0d08').lerp(new THREE.Color('#0f3a1c'), verde).getHexString() });
    // ── câmeras (POV do Adryan = logo à frente do rosto dele)
    const olhoA = Ad.osso('spine.005').getWorldPosition(v3()).add(v3(0, .08, 0)).addScaledVector(frente(Ad.obj.rotation.y), .13);
    const rostoI = Ig.cabeca.getWorldPosition(v3()), rostoA = Ad.osso('spine.005').getWorldPosition(v3()).add(v3(0, .1, 0)), rostoG = Gu.osso('spine.005').getWorldPosition(v3()).add(v3(0, .1, 0));
    if (camQ) cam(camQ.slice(0, 3), camQ.slice(3, 6), camQ[6]);
    else if (t < 2.85) cam(olhoA.toArray(), rostoI.clone().add(v3(0, -.1, 0)).toArray(), 50);                         // POV: o Igor aponta a porta: "Fecha essa porta imediatamente!"
    else if (t < 5.25) { const de = rostoA.clone().add(frente(Ad.obj.rotation.y).multiplyScalar(.95)).add(direita(Ad.obj.rotation.y).multiplyScalar(-.3)); cam(de.toArray(), rostoA.toArray(), 38); }   // Adryan: "Mas é o Nicolas, ele tá só!"
    else if (t < 9.6) cam(olhoA.toArray(), rostoI.toArray(), 42);                                                     // POV: "Ele vai ficar bem..."
    else if (t < 11.0) cam([.75, 1.55, 2.3], [P.lerp(Ad.obj.position.x, -.6, .5), 1.3, Ad.obj.position.z], 46);     // ele vai pra porta; o Gusta vem por trás
    else if (t < 15.0) cam([.1, 1.55, 3.3], [(rostoA.x + rostoG.x) / 2, 1.5, (rostoA.z + rostoG.z) / 2], 40);        // o Gusta segurando o Adryan pelos ombros
    else if (t < 17.55) cam([.75, 1.7, 1.1], [-.75, 1.1, 3.25], 44);                                                  // fecham a porta juntos
    else if (t < 18.35) { const b = botao.topo(); cam([b.x + .25, b.y + .3, b.z + .3], b.toArray(), 40); }           // o BOTÃO VERMELHO
    else if (t < 19.6) { const w = porta.volanteW(); cam([w.x + .55, w.y + .15, w.z - .75], w.toArray(), 42); }      // tranca: o volante girando
    else cam([.2, 1.75, 2.8], [1.6, 1.25, -1.9], 46);                                                                  // a estante desliza: a sala secreta, verde
  };
};
</script></body></html>
