<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 10 · O ELEVADOR (24 s): corredor de concreto, fluorescentes verdes piscando; o elevador chega, as portas abrem; Gusta e Adryan
     (com a maleta) saem e caminham conversando (vozes do Gusta e do Adryan); o Nicolas ficou lá fora. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:24}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 44, fundo: '#020604', perto: 5, longe: 26, cam: [.3, 1.4, 2.6], alvo: [0, 1.3, -8] }), cena = S.scene;
  const co = F.corredor({ comp: 13, lamps: [-.8, -5.5, -10] }); cena.add(co);
  const Gu = await E4.ator('gusta'), Ad = await E4.ator('adryan'); cena.add(Gu.obj, Ad.obj);
  const mal = T.maleta(); mal.scale.setScalar(.72); cena.add(mal);
  const fala = await V.vozes();
  const PISCA = [.4, .55, 4.9, 5.05, 9.6, 9.72, 16.2, 16.3];
  const Z0 = co.zf - .9, ZF = -.6;
  S.update = t => {
    const pis = PISCA.some(q => t >= q && t < q + .09), k = pis ? .12 : 1 - .05 * Math.sin(t * 120);
    const ab = P.suave(1.0, 2.2, t); co.portas(ab); A.assar(co, co.luzes(k, ab), '#07130b');
    P.luz({ keyDir: [0, .9, .3], keyCor: pis ? '#1a2a1e' : '#b4dcbf', fillDir: [0, .1, -1], fillCor: '#3b8a52', amb: pis ? '#0a140d' : '#25402e' });
    // Gusta (escolta) e Adryan (com a maleta) saem do elevador e andam devagar pelo corredor conversando; param no fim (17,8)
    const vG = fala('50', t, 'gusta'), vA = fala('50', t, 'adryan');
    let z = Z0;
    for (const [A2, x, fase] of [[Gu, .4, 0], [Ad, -.4, .4]]) {
      const anda = V.caminhar(A2, [x, Z0], [x, ZF], t, 2.4, 17.8, { fase, passo: 1.3 }); z = A2.obj.position.z;
      A2.obj.rotation.y = 0; if (!anda) A2.pose('idle', t + fase);
    }
    V.segurarMaleta(Ad, mal, t); mal.pulsar(t);
    // olhares: conversam de lado; o Gusta olha pra maleta quando fala do Projeto Mogg; no fim viram um pro outro
    const conversa = P.suave(2.8, 3.2, t), fim = P.suave(18.2, 19.2, t);
    V.girar(Gu, 'spine.005', [0, 1, 0], -.38 * conversa * (1 - P.suave(14.2, 14.6, t)) - .3 * P.suave(15.6, 16, t) - .2 * fim);
    V.girar(Gu, 'spine.005', [1, 0, 0], .3 * P.suave(14.2, 14.6, t) * (1 - P.suave(15.4, 15.8, t)));      // olha pra maleta
    V.girar(Ad, 'spine.005', [0, 1, 0], .36 * conversa * (1 - P.suave(7.6, 8.2, t)) + .3 * P.suave(11.9, 12.3, t) + .15 * fim);
    if (fim > 0) { Gu.obj.rotation.y = -.5 * fim; Ad.obj.rotation.y = .5 * fim; }
    V.falar(Gu, vG, t); V.falar(Ad, vA, t);
    // câmera: parada no começo (porta do elevador), depois anda de costas na frente deles; no fim, plano e contraplano
    if (t < 7) { S.camera.fov = 44; S.camera.position.set(.3, 1.4 + Math.sin(t * .8) * .01, 2.6); S.camera.lookAt(0, 1.3, -8); }
    else if (t < 18.4) { S.camera.fov = 40; S.camera.position.set(-.2, 1.62, z + 2.3); S.camera.lookAt(0, 1.45, z); }
    else if (t < 21.6) { S.camera.fov = 36; S.camera.position.set(-.9, 1.62, z + 1.5); S.camera.lookAt(.4, 1.55, z); }        // Gusta: "você vai entender..."
    else { S.camera.fov = 38; S.camera.position.set(.9, 1.6, z + 1.6); S.camera.lookAt(-.4, 1.5, z); }                         // Adryan fica pensando
    S.camera.updateProjectionMatrix();
  };
};
</script></body></html>
