<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 10 · O ELEVADOR (14 s): corredor de concreto, fluorescentes verdes piscando; o elevador chega, as portas abrem; Gusta (com a maleta)
     e Nicolas saem e caminham; conversa (legenda por enquanto; a voz do Gusta entra depois). Gusta olha a maleta; Nicolas olha o corredor. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:14}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
import * as E4 from '../../lib/elenco4.js';
import * as T from '../../lib/tgp.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 44, fundo: '#020604', perto: 5, longe: 26, cam: [.3, 1.4, 2.6], alvo: [0, 1.3, -8] }), cena = S.scene;
  const co = F.corredor({ comp: 13, lamps: [-.8, -5.5, -10] }); cena.add(co);
  const Gu = await E4.ator('gusta'), Ni = await E4.ator('nicolas'); cena.add(Gu.obj, Ni.obj);
  const mal = T.maleta(); mal.scale.setScalar(.72); cena.add(mal);
  const PISCA = [.4, .55, 4.9, 5.05, 9.6, 9.72];
  const Z0 = co.zf - .9;
  S.update = t => {
    const pis = PISCA.some(q => t >= q && t < q + .09), k = pis ? .12 : 1 - .05 * Math.sin(t * 120);
    const ab = P.suave(1.0, 2.2, t); co.portas(ab); A.assar(co, co.luzes(k, ab), '#07130b');
    P.luz({ keyDir: [0, .9, .3], keyCor: pis ? '#1a2a1e' : '#a9d4b4', fillDir: [0, .1, -1], fillCor: '#3b8a52', amb: pis ? '#0a140d' : '#1d3324' });
    // os dois saem do elevador (2,4) e andam até perto da câmera (~13,5)
    const d = P.clamp((t - 2.4) / 11.2) * (Z0 - (-.2)) * -1;
    for (const [A2, x] of [[Gu, .38], [Ni, -.42]]) { A2.obj.position.set(x, 0, Z0 + d); A2.obj.rotation.y = 0; if (t > 2.4 && t < 13.6) A2.pose('walk', t * .95 + (x > 0 ? 0 : .37)); else A2.pose('idle', t); }
    V.segurarMaleta(Gu, mal); mal.pulsar(t);
    V.girar(Gu, 'spine.005', [1, 0, 0], .28 * P.suave(10.6, 11.0, t) * (1 - P.suave(11.8, 12.2, t)));           // olha pra maleta
    V.girar(Gu, 'spine.005', [0, 1, 0], -.35 * (P.suave(3.0, 3.4, t) * (1 - P.suave(10.4, 10.8, t))));          // olha pro Nicolas enquanto conversam
    V.girar(Ni, 'spine.005', [0, 1, 0], .35 * P.suave(2.8, 3.2, t) * (1 - P.suave(9.6, 10, t)) - .4 * P.suave(10.6, 11, t));   // olha pro Gusta, depois pro corredor
    const z = Z0 + d;
    if (t < 7) { S.camera.fov = 44; S.camera.position.set(.3, 1.4 + Math.sin(t * .8) * .01, 2.6); S.camera.lookAt(0, 1.3, -8); }
    else { S.camera.fov = 40; S.camera.position.set(-.2, 1.62, z + 2.3); S.camera.lookAt(0, 1.45, z); }                    // anda de costas na frente deles
    S.camera.updateProjectionMatrix();
  };
};
</script></body></html>
