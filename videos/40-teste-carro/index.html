<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
window.SETUP = async () => {
  const q = new URLSearchParams(location.search), v = q.get('v') || 'frente';
  const S = F.noite({ fov: 42, perto: 3, longe: 22, luz: { keyDir: [.2, .5, 1], keyCor: '#c8e6d0', fillDir: [-.2, -.3, .9], fillCor: '#2f9a50', amb: '#4a6a52' } });
  const D = await V.carroComDupla(S.scene);
  const CAM = { maleta: [[.08, 1.02, .58], [-.36, .74, .3]], volante: [[-.05, 1.0, .58], [.38, .86, .42]], frente: [[.05, 1.22, 2.3], [.05, 1.0, .2]], ni: [[-1.2, 1.15, .75], [-.3, .85, .35]], ad: [[1.3, 1.15, .8], [.35, .95, .35]], lado: [[2.4, 1.1, .3], [0, .9, .3]] }[v];
  S.camera.position.set(...CAM[0]); S.camera.lookAt(...CAM[1]);
  S.update = t => { D.atualizar(t); window.D = D; window.dbg = D.cabecas().map(h => h.toArray().map(x => +x.toFixed(3))); };
};
</script></body></html>
