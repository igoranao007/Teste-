<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 PLANO 1 · 0:00–0:17 · ESTRADA: preto + ruído → sedã na estrada de terra (lateral) → aproxima do para-brisa → Adryan dirigindo, Nicolas com a maleta; Adryan fala (ficha na edição). -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:17}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
import * as F from '../../lib/filme.js';
import * as V from '../../lib/v4.js';
const { THREE } = P;
window.SETUP = async () => {
  const S = F.noite({ fov: 40, perto: 8, longe: 38, luz: { keyDir: [.2, .8, .6], keyCor: '#a8cdb2', amb: '#1a2e20', fillCor: '#1c5a30' } }), cena = S.scene, R = P.rng(4);
  const ext = new THREE.Group(), int = new THREE.Group(); cena.add(ext, int);
  ext.add(A.chaoA({ w: 220, d: 70, seg: 90, mapa: F.TEX.capim(), rep: [70, 22], z: -6 }));
  ext.add(A.chaoA({ w: 220, d: 7.5, seg: 70, mapa: F.TEX.terra(), rep: [60, 2], y: .02 }));
  const g1 = new THREE.Group(); ext.add(g1); F.mata(g1, R, { x0: -60, x1: 140, z0: -7, z1: -30, n: 110, h: 6 }); F.mata(g1, R, { x0: -60, x1: 140, z0: 6, z1: 22, n: 50, h: 5 });
  const postes = [-30, -6, 18, 42, 66, 90, 114].map(x => F.posteVerde(x, -9.5, { rot: Math.PI / 2 })); postes.forEach(p => ext.add(p));
  A.assar(ext, postes.map(p => p.luz()), '#1b3524');
  const car = await F.carro(); car.rotation.y = Math.PI / 2; ext.add(car);
  const D = await V.carroComDupla(int); int.position.set(0, -50, 0);
  const fala = await V.vozes();
  const preto = F.camada('background:#000'), chi = F.chiadoVerde();
  const POSTES = [11.2, 13.4, 15.6];
  S.update = t => {
    const fora = t < 10; ext.visible = fora; int.visible = !fora;
    const tc = Math.max(0, t - 2), x = -16 + tc * 8.2;
    if (fora) {
      P.nevoa({ perto: 8, longe: 38 }); P.luz({ keyDir: [.2, .8, .6], keyCor: '#a8cdb2', amb: '#1a2e20', fillCor: '#1c5a30' });
      car.position.set(x, .02 + Math.abs(Math.sin(tc * 13)) * .012, .4); car.encarar(S.camera); car.rodar(tc * 8.2);
      if (t < 6) { S.camera.fov = 40; S.camera.position.set(x + 2.6, .62, 7.4); S.camera.lookAt(x + 1.1, .95, 0); }
      else { const u = P.suave(6, 10, t);                                     // câmera vem pra frente do carro e chega no para-brisa
        S.camera.fov = P.lerp(40, 34, u); S.camera.position.set(x + P.lerp(7, 2.9, u), P.lerp(1.1, 1.35, u), P.lerp(3.2, .5, u)); S.camera.lookAt(x + P.lerp(0, .9, u), P.lerp(.9, 1.05, u), .4); }
      S.camera.updateProjectionMatrix();
      for (const p of postes) P.encarar(p.halo, S.camera), p.halo.quaternion.premultiply(p.getWorldQuaternion(new THREE.Quaternion()).invert());
    } else {                                                                   // pelo para-brisa
      int.position.set(0, 0, 0);
      let amar = 0, lado = 0; for (const q of POSTES) { const d = (t - q) / .32; if (Math.abs(d) < 2) { const e = Math.exp(-d * d); if (e > amar) { amar = e; lado = d; } } }
      const mix = (a, b) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), amar).getHexString();
      P.nevoa({ perto: 3, longe: 22 }); P.luz({ keyDir: [.2, .4, 1 - lado * .5], keyCor: mix('#b8dcc2', '#ffcf66'), fillDir: [-.2, -.3, .9], fillCor: '#2f9a50', amb: mix('#35503d', '#5a4c22') });
      const u = t - 10, v = fala('p1', u, 'adryan');
      V.sentar(D.Ad, D.car.assento, { dy: -.03 }); V.sentar(D.Ni, D.car.passageiro, { dy: -.03 }); D.colo();
      const bal = Math.sin(t * 5.1) * .012;
      V.girar(D.Ad, 'spine.005', [0, 0, 1], bal); V.falar(D.Ad, v, t); V.girar(D.Ni, 'spine.005', [0, 0, 1], bal * .8);
      V.girar(D.Ad, 'spine.005', [0, 1, 0], -.18 * P.suave(4.8, 5.4, u) * (1 - P.suave(6.2, 6.8, u)));      // olha de canto pro Nicolas
      D.mal.pulsar(t);
      S.camera.fov = 42; S.camera.position.set(.05 + Math.sin(t * 7.3) * .004, 1.28 + Math.sin(t * 11) * .004, 2.3 - u * .03); S.camera.lookAt(.05, 1.12, .2); S.camera.updateProjectionMatrix();
    }
    preto.style.opacity = t < 2 ? 1 : 0; chi.desenha(Math.round(t * 30), t < 2 ? .2 : 0, { dens: .35 });
  };
};
</script></body></html>
