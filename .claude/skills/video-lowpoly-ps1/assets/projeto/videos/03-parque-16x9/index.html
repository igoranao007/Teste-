<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Exemplo 3 · kit de terror (lib/arh.js) em 16:9: o parque depois de fechar. Alameda vazia com postes de sódio
     (luz assada por vértice, uma vez), lojas de porta baixada, roda-gigante sumindo na névoa. Câmera avança devagar;
     tarja 2,35:1 e carimbo digitado no canto. Som: drone + zumbido das lâmpadas. -->
<script>VIDEO={w:1920,h:1080,fps:30,dur:6}</script>
<script src="../../lib/boot.js"></script>
<style>#stage{background:#000;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%}</style></head><body>
<div id="stage"></div>
<script type="module">
import * as P from '../../lib/ps1.js';
import * as A from '../../lib/arh.js';
const { THREE } = P;

const S = P.palco({
  fov: 52, cam: [0, 1.55, 7], alvo: [0, 1.35, -10],
  fundoTex: P.ceu({ cores: [[0, '#04060a'], [.55, '#0d1219'], [1, '#1b222b']], faixas: 10 }),
  nevoa: { cor: '#161c24', perto: 5, longe: 27 },
});
const cena = S.scene, cam = S.camera, R = P.rng(11);

// ── texturas ──
const porta = P.textura(16, 32, (x, w, h) => {                 // porta de enrolar, baixada
  x.fillStyle = '#7d8187'; x.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) { x.fillStyle = '#5c6066'; x.fillRect(0, y, w, 1); x.fillStyle = '#90959b'; x.fillRect(0, y + 1, w, 1); }
});
const toldo = P.textura(16, 8, (x, w, h) => { for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#c9c2b4' : '#4d5a66'; x.fillRect(i * 4, 0, 4, h); } });
const fachada = P.textura(32, 32, (x, w, h, r) => {
  x.fillStyle = '#b3aa98'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { x.fillStyle = r() < .5 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.07)'; x.fillRect(Math.floor(r() * w), Math.floor(r() * h), 1, 1); }
  x.fillStyle = '#8b8373'; x.fillRect(0, 0, w, 2); x.fillRect(0, 15, w, 1);
});
const ladrilho = P.textura(32, 32, (x, w, h, r) => {
  x.fillStyle = '#827d74'; x.fillRect(0, 0, w, h);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) { x.fillStyle = ['#8a857b', '#7b766d', '#86817a'][Math.floor(r() * 3)]; x.fillRect(i * 8 + (j % 2) * 4, j * 8, 7, 7); }
}, { seed: 5 });

// ── chão da alameda ──
const chao = A.chaoA({ w: 26, d: 46, z: -10, seg: 90, mapa: ladrilho, rep: [13, 23] });
cena.add(chao);

// ── lojas dos dois lados, porta baixada ──
const lojas = new THREE.Group(); cena.add(lojas);
for (const s of [-1, 1]) for (let i = 0; i < 6; i++) {
  const z = 3 - i * 4.4, w = 4.2, h = 3 + R() * .9;
  const corpo = P.caixa(2.6, h, w, A.matA({ mapa: fachada, rep: [2, 2] }), { pos: [s * 6.4, h / 2, z], sy: 3, sz: 4 });
  lojas.add(corpo);
  lojas.add(P.caixa(.06, 2.1, 2.6, A.matA({ mapa: porta, rep: [2, 2.4] }), { pos: [s * 5.08, 1.05, z], sy: 3, sz: 3 }));
  const tol = P.caixa(.9, .06, w - .4, A.matA({ mapa: toldo, rep: [1, 6] }), { pos: [s * 4.75, 2.55, z], sz: 4 });
  tol.rotation.z = s * .32; lojas.add(tol);
}

// ── postes de sódio, bancos e lixeiras ──
const postes = [];
for (const s of [-1, 1]) for (let i = 0; i < 6; i++) {
  const p = A.poste(s * 3.4, 4.6 - i * 4.4, { rot: s > 0 ? Math.PI : 0, raio: 5.2, int: i === 2 && s < 0 ? .0 : 1.9 });
  cena.add(p); postes.push(p);
}
const banco = () => { const g = new THREE.Group(), m = A.matA({ cor: '#4f4a43' }), f = A.matA({ cor: '#2e3034' });
  for (let k = 0; k < 3; k++) g.add(P.caixa(1.5, .05, .12, m, { pos: [0, .48, -.16 + k * .16] }));
  for (let k = 0; k < 2; k++) g.add(P.caixa(1.5, .12, .04, m, { pos: [0, .7 + k * .16, -.27] }));
  for (const x of [-.65, .65]) g.add(P.caixa(.06, .48, .5, f, { pos: [x, .24, -.05] }));
  return g; };
for (const [x, z, r] of [[-2.7, .4, Math.PI / 2], [2.7, -4, -Math.PI / 2], [-2.7, -8.8, Math.PI / 2], [2.7, -13.2, -Math.PI / 2]]) { const b = banco(); b.position.set(x, 0, z); b.rotation.y = r; cena.add(b); }
for (const [x, z] of [[-2.6, 2.2], [2.6, -6.4], [-2.6, -11]]) cena.add(P.cilindro(.25, .22, .85, A.matA({ cor: '#3b4a45' }), { pos: [x, .43, z], seg: 8 }));
// uma pipoca esquecida no chão: a única coisa fora do lugar
cena.add(P.caixa(.16, .22, .12, A.matA({ cor: '#c9c2b4' }), { pos: [.6, .1, -1.6], rot: [0, .5, Math.PI / 2.1] }));

// ── roda-gigante sumindo na névoa ──
const roda = new THREE.Group(); roda.position.set(1.5, 8.2, -27); cena.add(roda);
const aco = A.matA({ cor: '#565d66' }), RR = 7;
const aro = []; for (let i = 0; i <= 36; i++) { const a = i / 36 * Math.PI * 2; aro.push([Math.cos(a) * RR, Math.sin(a) * RR, 0]); }
roda.add(P.tubo(aro, .09, aco, { seg: 48, lados: 4 }));
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; roda.add(P.tubo([[0, 0, 0], [Math.cos(a) * RR, Math.sin(a) * RR, 0]], .05, aco, { seg: 2, lados: 3 }));
  roda.add(P.caixa(.8, .7, .8, A.matA({ cor: '#6a6f75' }), { pos: [Math.cos(a) * RR, Math.sin(a) * RR - .6, 0] })); }
for (const s of [-1, 1]) cena.add(P.tubo([[1.5 + s * 3.2, 0, -27], [1.5, 8.2, -27]], .14, aco, { seg: 2, lados: 4 }));

// ── luz assada: tudo que é estático recebe os postes uma vez ──
const luzes = postes.map(p => p.luz()).filter(l => l.int > 0);
A.assar(cena, luzes, '#11141a');
for (const p of postes) if (p.luz().int > 0) { const h = A.halo(.34); h.position.set(...p.luz().pos); h.position.y += .2; cena.add(h); P.encarar(h, cam); }

S.update = t => {
  const k = P.suave(0, 6, t);
  cam.position.set(Math.sin(t * .35) * .05, 1.55 + Math.sin(t * .9) * .015, P.lerp(7, 4.4, k));
  cam.lookAt(0, 1.35, -10);
};

A.hud({ rec: false, tarja: 2.35, carimbo: [{ t: .5, txt: '[DATE] · [TIME] · [PLACE]' }] });
cue('drone', 0, { d: 6 }); cue('lampada', 0, { d: 6 });
[...'[DATE] · [TIME] · [PLACE]'].forEach((c, i) => c !== ' ' && cue('type', .5 + i / 22, { gain: -4 }));   // uma tecla por letra do carimbo
</script></body></html>
